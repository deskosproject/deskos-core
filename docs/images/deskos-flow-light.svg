<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" role="img" aria-labelledby="t d">
<title id="t">DeskOS: from organizational intent to workstation images</title>
<desc id="d">DeskOS flow. Organizational intent: a Workstation and Profiles in YAML, layered foundation, organization, role, workstation; the higher layer wins. deskosctl validates, composes, plans a typed IR and renders a build context deterministically: same inputs give a byte-identical plan. The Containerfile builds a bootc OCI image for CentOS Stream 10, Fedora 45 and AlmaLinux 10, which are published, and RHEL 10, which is built privately and never published. bootc-image-builder writes a QCOW2 disk from any of them; only CentOS Stream 10 also has an installer ISO.</desc>
