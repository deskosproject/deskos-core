apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: example-containers
spec:
  packages:
    - git
    - podman
    - buildah
    - skopeo
    - toolbox
---
apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: example-virtualization
spec:
  packages:
    - qemu-kvm
    - libvirt
    - virt-install
    - virt-viewer
    - cockpit
    - cockpit-machines
  enableUnits:
    - cockpit.socket
---
apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: example-platform-tools
spec:
  packages:
    - terraform
    - kubectl
    - code
    - google-chrome-stable
  repositories:
    - hashicorp
    - kubernetes
    - vscode
    - google-chrome
