apiVersion: desktop.deskos.org/v1alpha1
kind: GnomeProfile
metadata:
  name: example-devops-desktop
spec:
  # A managed workstation that pins its favorites: the session check tries to
  # write the key and must fail. Core never locks.
  locks:
    - shell.favorites
  defaults:
    appearance:
      fonts:
        # The role that lives in a terminal picks its monospace family: Red Hat
        # Mono comes from its own package set, and the terminal is the platform's
        # (ptyxis on the EL family), so the family has to be installed to mean
        # anything.
        terminal: {family: Red Hat Mono, size: 11}
    shell:
      favorites:
        - google-chrome.desktop
        - org.gnome.Nautilus.desktop
        - org.gnome.Ptyxis.desktop
        - com.microsoft.VSCode.desktop
