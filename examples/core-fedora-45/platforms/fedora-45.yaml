apiVersion: core.deskos.org/v1alpha1
kind: Platform
metadata:
  name: fedora-45
spec:
  displayName: Fedora 45 (Silverblue) — prerelease evaluation
  # THIS PLATFORM IS NOT OFFERED. It lives in an example root because Fedora 45 was
  # a prerelease when it was measured (2026-10-17) and DeskOS offers Fedora 44
  # only; it exists to check that the next Fedora release composes with the same
  # Fedora facts before anyone commits to it. It is not in `resources/platforms/`,
  # not in the platform matrix of docs/platforms.md, and has no reference
  # workstation; the example root carries it so that evaluating a release needs no
  # change to what DeskOS ships.
  #
  # The Fedora Project publishes this base itself (quay.io/fedora), so the platform
  # follows ADR 0004's official-base rule and declares no organization owner or
  # tier — like centos-stream-10 and almalinux-10. The base is Fedora's own desktop
  # bootc image, Silverblue, for the reason recorded in full in
  # resources/platforms/fedora-44.yaml: the minimal quay.io/fedora/fedora-bootc
  # carries no GNOME, no GDM, no Flatpak, no Plymouth and no icon-cache tool
  # (measured on :44 and :45), while Silverblue carries them as distribution
  # packages and keeps the GNOME base applications as RPMs (measured in the image:
  # gnome-shell 51.0, gdm 51.0, gnome-initial-setup 51.0, nautilus 51.0.1,
  # gnome-software 51.0, firefox 157.0).
  #
  # Why the evaluation matters: :45 is a *prerelease* — measured, os-release reads
  # "45.20261016.n.0 (Silverblue Prerelease)" and the base enables Fedora's
  # updates-testing repository, which the released :44 does not, so packages
  # installed during a build can come from testing (in the workstation transaction
  # measured below: papers, gnome-calculator, gnome-maps and gnome-text-editor
  # did). What DeskOS would have to decide before *offering* a release is on
  # docs/roadmap.md; nothing here commits to it. No Fedora 45 image was built.
  family: fedora
  release: "45"
  architectures: [x86_64]
  packageManager: rpm
  bootc:
    image: quay.io/fedora/fedora-silverblue:45
    # x86_64 manifest of the :45 index (config sha256:adbd174c...), built
    # 2026-10-16T07:51:18Z as Fedora 45.20261016.n.0 (ostree commit 9d2204f1...); the
    # index itself resolves to sha256:4a09381e.... It moves deliberately.
    digest: sha256:0bf25e6c805ee002e0de3ef641dd7f1879fb50788ce984de0497bd4fca3ad643
  distribution:
    # Fedora's archive is freely redistributable and needs no subscription.
    redistributable: true
    requiresSubscription: false
  packageGroups:
    - name: workstation
      # As on fedora-44: `workstation-product-environment` is a comps environment
      # ("Fedora Workstation") that dnf5 resolves through `group install`, and this
      # base already carries the shell. Measured on this release's repositories:
      # gnome-shell-extension-dash-to-dock 110, gnome-shell 51.0.
      rpmGroups: [workstation-product-environment]
      graphical: true
  displayManager: gdm.service
  gnome:
    dconfDatabase: distro
    loginScreen: true
    # Default of org.gnome.shell enabled-extensions on this base, measured in
    # /usr/share/glib-2.0/schemas/org.gnome.shell.gschema.override:
    # background-logo@fedorahosted.org.
    enabledExtensions: [background-logo@fedorahosted.org]
    extensions:
      - name: dash-to-dock
        package: gnome-shell-extension-dash-to-dock
        uuid: dash-to-dock@micxgx.gmail.com
    # gnome-shell 51.0 keeps app folders from the dconf defaults.
    appFolders: true
    appLauncher:
      package: gtk3
      command: /usr/bin/gtk-launch
  boot:
    # As on fedora-44: Fedora's own graphical boot uses `rhgb quiet`, DeskOS writes
    # /usr/lib/bootc/kargs.d/50-deskos.toml (Fedora's documented bootc kargs path,
    # measured to exist here), and rebuilding the initramfs in a container prints
    # dracut's non-fatal `/root` (a symlink to `var/roothome`, created at
    # deployment) and xattr errors while still producing an initramfs with
    # plymouthd in it.
    splashKernelArgument: rhgb
    quietKernelArgument: quiet
    # Measured: plymouth 26.134.222-6.fc45 with plymouth-scripts,
    # plymouth-system-theme and plymouth-theme-spinner already in the base, and
    # dracut's 45plymouth module. Fedora's own default Plymouth theme is bgrt.
    plymouthPackages: [plymouth, plymouth-scripts, plymouth-system-theme]
    plymouthDracutModule: plymouth
    # Measured in /usr/share/plymouth/themes/spinner: animation, throbber-0001..0030
    # and watermark frames, the shape DeskOS's own splash reuses on the EL family.
    spinnerFrames:
      package: plymouth-theme-spinner
      imageDir: /usr/share/plymouth/themes/spinner
  updates:
    # Measured on :44 and :45: both units are present in this base and neither is
    # enabled (over on quay.io/fedora/fedora-bootc:45 the timer *is* enabled), so
    # DeskOS's own staging timer is what stages an update here. They are listed so
    # it stays the only path if Fedora enables one. This one is declared on the
    # evaluation too, because the masking is what DeskOS's update policy depends
    # on.
    imageUpdateUnits: [bootc-fetch-apply-updates.timer, bootc-fetch-apply-updates.service]
  flatpak:
    # Measured: Flatpak 1.18.4 with `flatpak preinstall`, and
    # /usr/share/flatpak/preinstall.d present and empty.
    package: flatpak
    preinstall: true
  trust:
    anchorsDir: /etc/pki/ca-trust/source/anchors
    updateCommand: update-ca-trust
  iconCache:
    # Measured: gtk-update-icon-cache 3.24.52 (gtk3).
    package: gtk-update-icon-cache
    command: gtk-update-icon-cache --force --quiet
  downloads:
    # Measured 2026-10-18 on this base: it ships curl (8.21.0-6.fc45) at
    # /usr/sbin/curl, so the build's verified download works as it is.
    baseFetches: true
