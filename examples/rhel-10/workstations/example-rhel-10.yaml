apiVersion: core.deskos.org/v1alpha1
kind: Workstation
metadata:
  name: example-rhel-10
spec:
  displayName: DeskOS Core (RHEL 10)
  platformRef: rhel-10
  profiles:
    - deskos-core
    - deskos-gnome
    - rhel-family
    # The same DeskOS look and splash as every flavor; the families stay RHEL's own
    # Red Hat Text and Red Hat Mono, which is what a registered fleet sees (ADR 0026).
    - deskos-look
    - firefox
    - deskos-dock
    - deskos-reference-apps
