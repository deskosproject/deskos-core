# Same composition on the public platform, buildable without a subscription.
apiVersion: core.deskos.org/v1alpha1
kind: Workstation
metadata:
  name: example-devops-centos-stream-10
spec:
  displayName: Example DevOps Workstation
  platformRef: centos-stream-10
  profiles:
    - deskos-adwaita
    - deskos-core
    - deskos-dock
    - deskos-gnome
    - deskos-look
    - deskos-reference-apps
    - example-devops
    - example-organization
    - firefox
    - rhel-family
