apiVersion: core.deskos.org/v1alpha1
kind: Profile
metadata:
  name: example-organization
spec:
  layer: organization
  description: Example organization baseline for every workstation.
  resources:
    - kind: PackageSet
      name: example-organization
    - kind: TrustAnchor
      name: example-root-ca
    - kind: GnomeProfile
      name: example-desktop
    # The corporate network the image is built for: the trust decision travels,
    # and the identity and the secret come from the fleet (ADR 0027).
    - kind: NetworkProfile
      name: example-corp-8021x
    # The palette, as a Theme: the one kind this repository defined without a resource
    # using it until now.
    - kind: Theme
      name: example-theme
