apiVersion: desktop.deskos.org/v1alpha1
kind: GnomeProfile
metadata:
  name: example-desktop
spec:
  defaults:
    windows:
      buttons: [close]
    appearance:
      wallpaper:
        light: ../assets/example.svg
      loginLogo: ../assets/example-login-logo.svg
      # The organization names no font: a workstation on the vendor's desktop
      # keeps the vendor's families (Red Hat Text and Red Hat Mono on EL10), and
      # one that draws GNOME's look gets them from the deskos-adwaita profile.
    session:
      idle:
        blankAfter: 5m
      lock:
        enabled: true
        delay: 0s
    dock:
      position: bottom
      behavior: intellihide
      iconSize: 40
      showTrash: false
    shell:
      # The dock is enabled like any other extension; the dock settings above are the
      # ones DeskOS models for it.
      extensions:
        - {uuid: dash-to-dock@micxgx.gmail.com, enabled: true}
