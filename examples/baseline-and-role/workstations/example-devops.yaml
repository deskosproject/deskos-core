apiVersion: core.deskos.org/v1alpha1
kind: Workstation
metadata:
  name: example-devops-rhel10
spec:
  displayName: Example DevOps Workstation
  platformRef: rhel-10
  profiles:
    - deskos-core
    - example-baseline
    - example-devops
---
# Same composition on the public platform, buildable without a subscription.
apiVersion: core.deskos.org/v1alpha1
kind: Workstation
metadata:
  name: example-devops-centos10
spec:
  displayName: Example DevOps Workstation
  platformRef: centos-stream-10
  profiles:
    - deskos-core
    - example-baseline
    - example-devops
