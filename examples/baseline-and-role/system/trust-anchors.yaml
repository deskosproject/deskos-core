# The organization's own root CA. The image places it in the platform trust
# store's anchors directory, and one build-time update-ca-trust makes it
# trusted by every TLS client that reads the system store (dnf, curl, and
# browsers that use the system store).
apiVersion: system.deskos.org/v1alpha1
kind: TrustAnchor
metadata:
  name: example-root-ca
spec:
  anchors:
    - name: example-root-ca
      file: ../assets/example-root-ca.crt
