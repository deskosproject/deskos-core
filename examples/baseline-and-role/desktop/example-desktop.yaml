apiVersion: desktop.deskos.org/v1alpha1
kind: GnomeProfile
metadata:
  name: example-desktop
spec:
  defaults:
    windows:
      buttons: [close]
    appearance:
      wallpaper:
        light: ../assets/example.svg
      loginLogo: ../assets/example-login-logo.svg
      fonts:
        interface: { family: Noto Sans, size: 11 }
        document: { family: Noto Sans, size: 11 }
        monospace: { family: Noto Sans Mono, size: 10 }
    session:
      idle:
        blankAfter: 5m
      lock:
        enabled: true
        delay: 0s
    dock:
      position: bottom
      behavior: intellihide
      iconSize: 40
      showTrash: false
    shell:
      # The dock is enabled like any other extension; the dock settings above are the
      # ones DeskOS models for it.
      extensions:
        - {uuid: dash-to-dock@micxgx.gmail.com, enabled: true}
