apiVersion: core.deskos.org/v1alpha1
kind: Profile
metadata:
  name: deskos-gnome
spec:
  layer: foundation
  description: DeskOS's own GNOME defaults (session timeout and lock, software updates), for workstations whose platform ships a desktop DeskOS can write to.
  resources:
    # The office and desktop font families travel with the desktop, not with the
    # core: a server platform has no use for them.
    - kind: PackageSet
      name: deskos-fonts
    # Georgia's and Overpass's families, which EL10 does not package; they land in
    # the font directory fontconfig reads, pinned by checksum.
    - kind: BinaryArtifact
      name: gelasio
    - kind: BinaryArtifact
      name: gelasio-italic
    - kind: BinaryArtifact
      name: gelasio-license
    - kind: BinaryArtifact
      name: overpass
    - kind: BinaryArtifact
      name: overpass-italic
    - kind: BinaryArtifact
      name: overpass-license
    - kind: GnomeProfile
      name: deskos-core
    # Tray icons, on every workstation: Fedora delivers Fedora's package, EL10 the
    # pinned upstream release, and each platform's catalog says which (ADR 0021).
    - kind: GnomeProfile
      name: deskos-tray
    # If a workstation also wants the DeskOS look, it adds the deskos-look
    # profile; if it wants only the GNOME defaults, this one is enough.
