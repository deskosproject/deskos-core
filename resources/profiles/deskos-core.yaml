apiVersion: core.deskos.org/v1alpha1
kind: Profile
metadata:
  name: deskos-core
spec:
  layer: foundation
  description: DeskOS Core, the distribution-independent GNOME workstation foundation.
  resources:
    - kind: PackageSet
      name: deskos-core
    - kind: UpdatePolicy
      name: deskos-core
    # The GNOME defaults are deliberately absent here: they are DeskOS's own
    # opinion about the desktop, and a workstation whose platform ships a desktop
    # of its own must be able to leave them out. A workstation that wants them
    # adds the deskos-gnome profile (ADR 0016).
    # The look is deliberately absent too: wallpaper, login logo and boot splash
    # are the platform's look and feel, or an organization's choice, not the
    # foundation's. A workstation that wants them adds the deskos-look profile,
    # and one that wants only a quiet graphical boot adds deskos-boot.
