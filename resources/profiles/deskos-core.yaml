apiVersion: core.deskos.org/v1alpha1
kind: Profile
metadata:
  name: deskos-core
spec:
  layer: foundation
  description: DeskOS Core, the distribution-independent GNOME workstation foundation.
  resources:
    - kind: PackageSet
      name: deskos-core
    - kind: GnomeProfile
      name: deskos-core
    - kind: UpdatePolicy
      name: deskos-core
    # The boot look is deliberately absent here: how the machine boots is the
    # platform's experience, or an organization's choice, not the foundation's.
    # A workstation that wants the DeskOS splash adds the deskos-splash profile.
