apiVersion: core.deskos.org/v1alpha1
kind: Profile
metadata:
  name: firefox
spec:
  layer: foundation
  description: Firefox from Flathub, which updates independently of the image. A platform that keeps the vendor RPM, as RHEL 10 does in AppStream, can install it in a PackageSet instead.
  resources:
    - kind: FlatpakSet
      name: firefox
