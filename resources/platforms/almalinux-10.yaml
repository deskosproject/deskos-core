apiVersion: core.deskos.org/v1alpha1
kind: Platform
metadata:
  name: almalinux-10
spec:
  displayName: AlmaLinux 10
  # AlmaLinux 10 is a shipped EL10 platform. The vendor publishes the bootc
  # base itself, so the platform follows ADR 0004's official-base rule and
  # declares no organization owner or tier, like centos-stream-10 and rhel-10.
  # The vendor still labels its bootc images experimental; the pin below is the
  # base DeskOS builds and tests. The facts are EL10 conventions modeled on
  # rhel-10, and the platform matrix states what was verified (invariant 10).
  family: almalinux
  release: "10"
  architectures: [x86_64]
  packageManager: rpm
  bootc:
    image: quay.io/almalinuxorg/almalinux-bootc:10
    # Index of the :10 tag, 2026-11-03 (the base as served that day). The group
    # install resolves to the same 1316 package names; the base moves for its
    # own packages, and the publish pipeline rescans the result. What remains
    # accepted is recorded, with a reason, in
    # tests/supply-chain/exceptions-almalinux-10.json.
    digest: sha256:5ef1b06e03479c7d77e98b6f70dd0f5a36fce900ed24d6ece0d4f3a9b04b323d
  # ADR 0028: the installed package set the group must resolve to. Measured on
  # this base digest by the first publish leg.
  packageManifest: manifests/almalinux-10.txt
  distribution:
    # AlmaLinux's archive is freely redistributable and needs no subscription.
    redistributable: true
    requiresSubscription: false
  packageGroups:
    - name: workstation
      rpmGroups: [workstation-product-environment]
      graphical: true
      # setroubleshoot is mandatory in workstation-product, and its first-login AVC
      # notification is not wanted on a workstation. This family's Internet Browser
      # group names only redhat-flatpak-preinstall-firefox, which AlmaLinux's archive
      # does not carry; the browser is PackageSet/firefox, the RPM from AppStream.
      excludePackages: [setroubleshoot, setroubleshoot-plugins, setroubleshoot-server, redhat-flatpak-preinstall-firefox]
  # Bazaar is the workstation's application store; GNOME Software is not. The
  # build removes it after the package transaction and proves it is absent
  # (docs/adr/0022). The names are a no-op on a base or group that does not ship
  # them, which is why the same declaration is safe across the EL10 family.
  removePackages: [gnome-software, gnome-software-rpm-ostree]
  unavailablePackages:
    - name: gnome-shell-extension-appindicator
      reason: not packaged for EL10 — measured on this base (2026-10-20) absent from baseos, appstream, extras and CRB; EPEL 10 carries 61-1.el10_2 and it resolves on this base (CRB, which its libappindicator-gtk3 dependency needs for libdbusmenu, is enabled here), but this platform does not enable EPEL; asking for it fails here instead of mid-build, while the profile gets the pinned artifact (ADR 0021)
  displayManager: gdm.service
  gnome:
    dconfDatabase: distro
    loginScreen: true
    # GDM reads its own profile; the EL family and Fedora use the gdm database.
    loginScreenDatabase: gdm
    # Default of org.gnome.shell enabled-extensions on this family.
    enabledExtensions: [background-logo@fedorahosted.org]
    extensions:
      - name: dash-to-dock
        uuid: dash-to-dock@micxgx.gmail.com
        source:
          # Upstream v110 declares GNOME Shell 45–51. The vendor packages stop
          # earlier (Fedora's 105 at 50, EL10's build at 49), so one pinned
          # artifact keeps the same extension on every flavor (docs/adr/0021).
          version: "110"
          url: https://github.com/micheleg/dash-to-dock/releases/download/extensions.gnome.org-v110/dash-to-dock%40micxgx.gmail.com.zip
          sha256: 3e60680fe7217b905aac4f10deb042e39fcf49168c9b8fdcc5a711bdd49bd3d2
      # Not in AlmaLinux 10s repositories as a usable package; the image delivers
      # the pinned upstream release instead (docs/adr/0021).
      - name: appindicator
        uuid: appindicatorsupport@rgcjonas.gmail.com
        source:
          # Neither the vendor repositories nor EPEL can install this on CentOS
          # Stream 10: EPEL's RPM needs libappindicator-gtk3, whose libdbusmenu
          # dependency is in CRB (docs/adr/0021). Upstream's release is
          # self-contained, and this is the exact artifact GNOME Extensions ships.
          version: "66"
          url: https://github.com/ubuntu/gnome-shell-extension-appindicator/releases/download/v66/appindicatorsupport%40rgcjonas.gmail.com.zip
          sha256: f2b17c7c5590f729853cd353f20a9e59b6e0c32e9c0a561976e09f5a97487730
    appFolders: true
    appLauncher:
      package: gtk3
      command: /usr/bin/gtk-launch
    # AlmaLinux 10 desktop ships Ptyxis, like the rest of the EL10 family.
    terminal:
      package: ptyxis
      dconfPath: /org/gnome/Ptyxis/
      fontKey: font-name
      useSystemFontKey: use-system-font
  boot:
    splashKernelArgument: rhgb
    quietKernelArgument: quiet
    plymouthPackages: [plymouth, plymouth-scripts, plymouth-system-theme]
    plymouthDracutModule: plymouth
    spinnerFrames:
      package: plymouth-theme-spinner
      imageDir: /usr/share/plymouth/themes/spinner
  updates:
    # bootc-fetch-apply-updates is enabled by the base image (default.target.wants)
    # and runs bootc upgrade --apply, which reboots. rpm-ostreed-automatic is the
    # ostree CLI staging timer; masking both keeps `deskos update` the only path
    # that can stage an update, whatever an ostree image left enabled.
    imageUpdateUnits: [bootc-fetch-apply-updates.timer, bootc-fetch-apply-updates.service, rpm-ostreed-automatic.timer, rpm-ostreed-automatic.service]
  flatpak:
    package: flatpak
    preinstall: true
  trust:
    anchorsDir: /etc/pki/ca-trust/source/anchors
    blocklistDir: /etc/pki/ca-trust/source/blocklist
    updateCommand: update-ca-trust
  iconCache:
    # Which package provides the icon cache tool and how it is invoked are this
    # platform's names, not Core's (ADR 0004).
    package: gtk-update-icon-cache
    command: gtk-update-icon-cache --force --quiet
  downloads:
    # Measured 2026-10-18 on this base: it ships curl (8.12.1-4.el10_2.7) at /usr/bin/curl, so the build's
    # verified download works as it is. The package manager needs it, which is why a
    # base that installs anything has it.
    baseFetches: true
