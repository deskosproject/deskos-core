apiVersion: core.deskos.org/v1alpha1
kind: Platform
metadata:
  name: almalinux-10
spec:
  displayName: AlmaLinux 10
  # The vendor here is the AlmaLinux project, which publishes this base itself, so
  # the platform follows ADR 0004's official-base rule and declares no
  # organization owner or tier — like centos-stream-10 and rhel-10. The vendor
  # labels the base experimental, and DeskOS has not built or booted this
  # platform, so the facts below are EL10 conventions modeled on rhel-10 and are
  # NOT verified against AlmaLinux. That is a bounded claim (invariant 10), not a
  # support statement.
  family: almalinux
  release: "10"
  architectures: [x86_64]
  packageManager: rpm
  bootc:
    image: quay.io/almalinuxorg/almalinux-bootc:10
    # x86_64 manifest of the :10 index, 2026-10-14 (AlmaLinux 10.2.20261014.0).
    # The vendor's bootc images are experimental; move this deliberately.
    digest: sha256:214be10090671348e79a70b86ec42f0db5000bdb6acb2c43a947dafa9225b3bf
  distribution:
    # AlmaLinux's archive is freely redistributable and needs no subscription.
    redistributable: true
    requiresSubscription: false
  packageGroups:
    - name: workstation
      rpmGroups: [workstation-product-environment]
      graphical: true
      # As on the rest of the family: mandatory in workstation-product, and its
      # first-login AVC notification is not wanted on a workstation.
      excludePackages: [setroubleshoot, setroubleshoot-plugins, setroubleshoot-server]
  displayManager: gdm.service
  gnome:
    dconfDatabase: distro
    loginScreen: true
    # Default of org.gnome.shell enabled-extensions on this family.
    enabledExtensions: [background-logo@fedorahosted.org]
    extensions:
      - name: dash-to-dock
        package: gnome-shell-extension-dash-to-dock
        uuid: dash-to-dock@micxgx.gmail.com
    appFolders: true
    appLauncher:
      package: gtk3
      command: /usr/bin/gtk-launch
  boot:
    splashKernelArgument: rhgb
    quietKernelArgument: quiet
    plymouthPackages: [plymouth, plymouth-scripts, plymouth-system-theme]
    plymouthDracutModule: plymouth
    spinnerFrames:
      package: plymouth-theme-spinner
      imageDir: /usr/share/plymouth/themes/spinner
  updates:
    # Enabled by the base image (default.target.wants); runs bootc upgrade --apply,
    # which reboots.
    imageUpdateUnits: [bootc-fetch-apply-updates.timer, bootc-fetch-apply-updates.service]
  flatpak:
    package: flatpak
    preinstall: true
  trust:
    anchorsDir: /etc/pki/ca-trust/source/anchors
    updateCommand: update-ca-trust
  iconCache:
    # Which package provides the icon cache tool and how it is invoked are this
    # platform's names, not Core's (ADR 0004).
    package: gtk-update-icon-cache
    command: gtk-update-icon-cache --force --quiet
