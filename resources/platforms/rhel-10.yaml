apiVersion: core.deskos.org/v1alpha1
kind: Platform
metadata:
  name: rhel-10
spec:
  displayName: Red Hat Enterprise Linux 10
  family: rhel
  release: "10"
  architectures: [x86_64]
  packageManager: rpm
  bootc:
    image: registry.redhat.io/rhel10/rhel-bootc:10.2
    # x86_64 manifest (config sha256:14d164b5...), created 2026-10-12; move it deliberately.
    digest: sha256:d4d57dd13569e05bf6732eacacf2ad84a20ba22d232cd64b9a6820d692f682ee
  distribution:
    # rhel-bootc and images derived from it are covered by the RHEL EULA and
    # must not be publicly redistributed.
    redistributable: false
    requiresSubscription: true
  packageGroups:
    - name: workstation
      rpmGroups: [workstation-product-environment]
      graphical: true
      # Its Firefox Flatpak needs a session-bus authenticator, which fails the system preinstall of every declared Flatpak.
      excludePackages: [redhat-flatpak-preinstall-firefox]
  unavailablePackages:
    - name: virt-manager
      reason: RHEL 10 moved it to the CodeReady Linux Builder repository, whose packages Red Hat does not support
  displayManager: gdm.service
  gnome:
    dconfDatabase: distro
    # GDM's dconf profile (user, gdm, local, site, distro) reads it too.
    loginScreen: true
    enabledExtensions: [background-logo@fedorahosted.org]
    extensions:
      - name: dash-to-dock
        package: gnome-shell-extension-dash-to-dock
        uuid: dash-to-dock@micxgx.gmail.com
    # No appFolders: gnome-shell 49.4 replaces dconf-default app folders at first login (fixed in 49.5).
    # Starts an application by desktop file id (keyboard shortcuts).
    appLauncher:
      package: gtk3
      command: /usr/bin/gtk-launch
  boot:
    # Plymouth shows its graphical splash only with rhgb, splash or
    # plymouth.graphical on the kernel command line.
    splashKernelArgument: rhgb
    quietKernelArgument: quiet
    plymouthPackages: [plymouth, plymouth-scripts, plymouth-system-theme]
    plymouthDracutModule: plymouth
    # Stock two-step spinner frames reused by a DeskOS-owned theme.
    spinnerFrames:
      package: plymouth-theme-spinner
      imageDir: /usr/share/plymouth/themes/spinner
  updates:
    # Enabled by the base image (default.target.wants); runs bootc upgrade --apply, which reboots.
    imageUpdateUnits: [bootc-fetch-apply-updates.timer, bootc-fetch-apply-updates.service]
  flatpak:
    package: flatpak
    preinstall: true
  # Image-owned CA anchors go in source/anchors; one build-time
  # update-ca-trust regenerates the extracted store from them.
  trust:
    anchorsDir: /etc/pki/ca-trust/source/anchors
    updateCommand: update-ca-trust
  iconCache:
    # Which package provides the icon cache tool and how it is invoked are this
    # platform's names, not Core's (ADR 0004).
    package: gtk-update-icon-cache
    command: gtk-update-icon-cache --force --quiet
