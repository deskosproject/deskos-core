apiVersion: core.deskos.org/v1alpha1
kind: Platform
metadata:
  name: centos-stream-10
spec:
  displayName: CentOS Stream 10
  family: centos
  release: "10"
  architectures: [x86_64]
  packageManager: rpm
  bootc:
    image: quay.io/centos-bootc/centos-bootc:stream10
    # x86_64 manifest (config sha256:e2e05764...), created 2026-10-26; move it deliberately.
    digest: sha256:0af0dc397389a8f37d8809fab35eac3c3ace383826769b559e3116c03b7a8e11
  distribution:
    redistributable: true
    requiresSubscription: false
  packageGroups:
    - name: workstation
      rpmGroups: [workstation-product-environment]
      graphical: true
      # Mandatory in workstation-product; its first-login AVC notification is not wanted on a workstation.
      excludePackages: [setroubleshoot, setroubleshoot-plugins, setroubleshoot-server]
  # Bazaar is the workstation's application store; GNOME Software is not. The
  # build removes it after the package transaction and proves it is absent
  # (docs/adr/0022). The names are a no-op on a base or group that does not ship
  # them, which is why the same declaration is safe across the EL10 family.
  removePackages: [gnome-software, gnome-software-rpm-ostree]
  unavailablePackages:
    - name: virt-manager
      reason: only in the CentOS Stream CRB repository, which is disabled by default and not enabled by DeskOS; RHEL 10 moved it to its unsupported CodeReady Linux Builder repository
    - name: gnome-shell-extension-appindicator
      reason: not packaged for EL10 — measured on this base (2026-10-20) absent from baseos, appstream, extras and CRB; EPEL 10 carries 61-1.el10_2, but its libappindicator-gtk3 dependency needs libdbusmenu from CRB, which this platform does not enable; asking for it fails here instead of mid-build, while the profile gets the pinned artifact (ADR 0021)
  displayManager: gdm.service
  gnome:
    # /etc/dconf/profile/user from the dconf package reads user, local, site
    # and distro; distro is the vendor-defaults slot, below local and site.
    dconfDatabase: distro
    # GDM's dconf profile (user, gdm, local, site, distro) reads it too.
    loginScreen: true
    # Default of org.gnome.shell enabled-extensions on this platform.
    enabledExtensions: [background-logo@fedorahosted.org]
    extensions:
      - name: dash-to-dock
        uuid: dash-to-dock@micxgx.gmail.com
        source:
          # Upstream v110 declares GNOME Shell 45–51. The vendor packages stop
          # earlier (Fedora's 105 at 50, EL10's build at 49), so one pinned
          # artifact keeps the same extension on every flavor (docs/adr/0021).
          version: "110"
          url: https://github.com/micheleg/dash-to-dock/releases/download/extensions.gnome.org-v110/dash-to-dock%40micxgx.gmail.com.zip
          sha256: 3e60680fe7217b905aac4f10deb042e39fcf49168c9b8fdcc5a711bdd49bd3d2
      # Not in CentOS Stream 10s repositories as a usable package; the image delivers
      # the pinned upstream release instead (docs/adr/0021).
      - name: appindicator
        uuid: appindicatorsupport@rgcjonas.gmail.com
        source:
          # Neither the vendor repositories nor EPEL can install this on CentOS
          # Stream 10: EPEL's RPM needs libappindicator-gtk3, whose libdbusmenu
          # dependency is in CRB (docs/adr/0021). Upstream's release is
          # self-contained, and this is the exact artifact GNOME Extensions ships.
          version: "66"
          url: https://github.com/ubuntu/gnome-shell-extension-appindicator/releases/download/v66/appindicatorsupport%40rgcjonas.gmail.com.zip
          sha256: f2b17c7c5590f729853cd353f20a9e59b6e0c32e9c0a561976e09f5a97487730
    # gnome-shell 49.5 keeps app folders from the dconf defaults.
    appFolders: true
    # Starts an application by desktop file id (keyboard shortcuts).
    appLauncher:
      package: gtk3
      command: /usr/bin/gtk-launch
  boot:
    # Plymouth shows its graphical splash only with rhgb, splash or
    # plymouth.graphical on the kernel command line.
    splashKernelArgument: rhgb
    quietKernelArgument: quiet
    plymouthPackages: [plymouth, plymouth-scripts, plymouth-system-theme]
    plymouthDracutModule: plymouth
    # Stock two-step spinner frames reused by a DeskOS-owned theme.
    spinnerFrames:
      package: plymouth-theme-spinner
      imageDir: /usr/share/plymouth/themes/spinner
  updates:
    # Enabled by the base image (default.target.wants); runs bootc upgrade --apply, which reboots.
    imageUpdateUnits: [bootc-fetch-apply-updates.timer, bootc-fetch-apply-updates.service]
  flatpak:
    package: flatpak
    preinstall: true
  # Image-owned CA anchors go in source/anchors; one build-time
  # update-ca-trust regenerates the extracted store from them. Distrusted
  # certificates go in source/blocklist, which p11-kit reads the same way.
  trust:
    anchorsDir: /etc/pki/ca-trust/source/anchors
    blocklistDir: /etc/pki/ca-trust/source/blocklist
    updateCommand: update-ca-trust
  iconCache:
    # Which package provides the icon cache tool and how it is invoked are this
    # platform's names, not Core's (ADR 0004).
    package: gtk-update-icon-cache
    command: gtk-update-icon-cache --force --quiet
  downloads:
    # Measured 2026-10-18 on this base: it ships curl (8.12.1-6.el10) at /usr/bin/curl, so the build's
    # verified download works as it is. The package manager needs it, which is why a
    # base that installs anything has it.
    baseFetches: true
