apiVersion: core.deskos.org/v1alpha1
kind: Platform
metadata:
  # The release is 26.04; a resource name allows no dot, so it carries no dot here.
  name: ubuntu-2604
spec:
  displayName: Ubuntu 26.04 LTS
  family: ubuntu
  release: "26.04"
  # ADR 0014: an organization-owned base names its owner and its tier in the
  # resource, not in a comment. An unnamed owner is not a tier.
  owner: the Project DeskOS
  tier: organization
  architectures: [x86_64]
  packageManager: deb
  bootc:
    image: quay.io/deskos/deskos-ubuntu-base:26.04
    # The manifest digest of the base with no third-party apt source and no
    # inherited account. The account mattered: GDM starts GNOME Initial Setup only
    # when no user exists and asks AccountsService, which counted the uid-1000
    # `ubuntu` account the upstream container image ships — so the wizard never ran.
    # With it removed, `tests/vm/firstbootcheck.py` reports the wizard running.
    # Confirmed against the registry on 2026-10-16: `:26.04` and `:latest` both
    # resolve to this digest. It moves deliberately.
    digest: sha256:0ef21d0691c298a1e2d7d8737807ff9d9bf384784bc545fa816f8b5dca0c1fc5
  distribution:
    # Ubuntu's archive is freely redistributable and needs no subscription. The
    # base, however, is maintained by the Project DeskOS and not by Canonical:
    # `owner` and `tier` above say who is accountable, and nothing here claims
    # vendor support (ADR 0014).
    redistributable: true
    requiresSubscription: false
  packageGroups:
    # The workstation group maps to the platform's own metapackage. The base
    # already ships it, so on this platform the group installs nothing.
    - name: workstation
      members: [ubuntu-desktop-minimal]
      graphical: true
  packageAliases:
    # Ubuntu publishes NetworkManager as network-manager.
    NetworkManager: network-manager
  displayManager: gdm.service
  # Ubuntu's graphical splash uses "splash" where the RHEL family uses "rhgb".
  # Plymouth itself is not in the base yet: the build installs it from the
  # platform's own archive. Whether a DeskOS boot theme belongs on a platform
  # whose boot experience is its own is the same question the dock raised, and it
  # is not decided here.
  boot:
    splashKernelArgument: splash
    quietKernelArgument: quiet
    plymouthPackages: [plymouth, plymouth-themes]
    plymouthDracutModule: plymouth
  # The base ships bootc's own update units, enabled by default.target.wants.
  updates:
    imageUpdateUnits: [bootc-fetch-apply-updates.timer, bootc-fetch-apply-updates.service]
  gnome:
    dconfDatabase: distro
    loginScreen: true
  flatpak:
    # The base carries no Flatpak, and this platform does not pretend otherwise.
    # `preinstall` is the mechanism DeskOS's FlatpakSet needs, and `flatpak preinstall`
    # only exists since Flatpak 1.17; 26.04 publishes 1.16.6, and no suite of 26.04
    # carries a newer one (backports included). The spike got one from the Flatpak
    # team's PPA, and carrying a third-party PPA inside the base is a supply-chain
    # decision this project declined (ADR 0010). A workstation that declares a system
    # FlatpakSet therefore fails composition with that reason (invariant 9). The
    # vendor's own application channel on Ubuntu is snap, which DeskOS does not model.
    preinstall: false
