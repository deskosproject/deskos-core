apiVersion: system.deskos.org/v1alpha1
kind: UpdatePolicy
metadata:
  name: rhel-family
spec:
  # The RHEL family ships Flatpak as its application channel (PackageSet/rhel-family),
  # so it also consents to updating it. Both are platform-family facts, not
  # foundation ones (ADR 0014): the foundation declares neither, so a platform that
  # carries no Flatpak is not asked for a Flatpak package it does not have.
  flatpak:
    automatic: true
    schedule: daily
    requireACPower: true
