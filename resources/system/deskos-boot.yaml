apiVersion: system.deskos.org/v1alpha1
kind: BootProfile
metadata:
  name: deskos-boot
spec:
  # Plymouth splash instead of scrolling boot messages; ESC shows details, and
  # failures are still printed. This is the boot behaviour only, no DeskOS
  # artwork: it fits a platform whose own look is fine but which boots with text.
  splash: graphical
  quiet: true
