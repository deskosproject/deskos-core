# /home is a symlink to var/home on every bootc base DeskOS pins, and the base
# does not ship var/home. Whichever component creates it first can leave it
# default_t, and a confined oddjob_mkhomedir_t then cannot create a user's home
# inside it (issue #409). `d` creates the directory; `z` restores its policy
# context at every boot. Children created later get their own contexts.
d /var/home 0755 root root -
z /var/home - - - -
