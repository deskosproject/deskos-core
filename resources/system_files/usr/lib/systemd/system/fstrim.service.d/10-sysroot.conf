# fstrim only reads the first existing file in --listed-in, and /etc/fstab on a
# bootc system has no /sysroot entry, so the root filesystem is never trimmed.
# Read the live mount list instead (ublue-os/bluefin#4965, issue #439).
[Service]
ExecStart=
ExecStart=/usr/sbin/fstrim --listed-in /proc/self/mountinfo --verbose --quiet-unsupported
