apiVersion: core.deskos.org/v1alpha1
kind: Workstation
metadata:
  name: deskos-core-almalinux-10
spec:
  displayName: DeskOS Core (AlmaLinux 10)
  platformRef: almalinux-10
  profiles:
    - deskos-core
    - deskos-trust
    - deskos-gnome
    - rhel-family
    # The DeskOS look and the DeskOS families, the same as on CentOS Stream 10 and
    # Fedora: EL10's own default is Red Hat Text and Red Hat Mono, and the Core
    # look draws GNOME's Adwaita Sans and Adwaita Mono (ADR 0026).
    - deskos-look
    - deskos-adwaita
    - firefox
    - deskos-dock
    - deskos-reference-apps
