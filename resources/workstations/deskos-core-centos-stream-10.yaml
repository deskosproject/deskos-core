apiVersion: core.deskos.org/v1alpha1
kind: Workstation
metadata:
  name: deskos-core-centos-stream-10
spec:
  displayName: DeskOS Core (CentOS Stream 10)
  platformRef: centos-stream-10
  profiles:
    - deskos-core
    - deskos-gnome
    # CentOS Stream 10 is the platform DeskOS draws GNOME's look on, so it carries
    # GNOME's own families; a workstation on a vendor desktop keeps the vendor's.
    - deskos-adwaita
    - rhel-family
    - deskos-look
    - deskos-reference-apps
    - firefox
    - deskos-dock
