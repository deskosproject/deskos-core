apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: deskos-core
spec:
  groups:
    - workstation
  # The foundation names no individual packages, for two measured reasons
  # (2026-10-16):
  #
  #  - NetworkManager is already in the base of both families (measured:
  #    NetworkManager 1.58 in the CentOS Stream 10 base, network-manager 1.54.3 in
  #    the Ubuntu base), so naming it installed nothing. It also forced Core to
  #    carry one family's spelling of it and to ask every platform for a
  #    translation. ADR 0004 does not want Core to know either spelling.
  #  - A browser, a firewall and an application channel are platform or
  #    organization choices (ADR 0014), not foundation ones. They cannot live
  #    here, because composition unions sets and no organization could take them
  #    back (ADR 0003).
  #
  # What is left is the workstation group, which maps to each platform's own
  # desktop metapackage. bootc is deliberately absent too: every platform starts
  # from its vendor's bootc base (ADR 0004), and on Ubuntu bootc is not an archive
  # package at all.
