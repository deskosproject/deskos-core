apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: deskos
spec:
  # DeskOS's runtime companion (ADR 0018): it reads the plan the image carries, so a
  # machine can be asked what it was built from, have its drift measured against that
  # plan, and update behind a guard. The pin names a published release asset and its
  # checksum, the same way a platform's base names a digest, so it moves deliberately.
  #
  # This pin and the deskosctl pin a flavor uses to build are independent: they name
  # different assets of possibly different releases, which is why this commit is not
  # the tag. What has to hold deliberately is that the runtime a release publishes can
  # read the plans that release renders.
  #
  # The destination is /usr/bin/deskos because `sudo` searches /usr/bin through its
  # secure_path and does not search /usr/local/bin, and `sudo deskos update` is the
  # documented command. The schema admits this one path and keeps every other
  # BinaryArtifact in /usr/local/bin, which belongs to no package (ADR 0018, amended).
  #
  # Limit, named rather than implied: the checksum pins the bytes and nothing else. It
  # does not attest that the asset was built from this source tree, and the release
  # signs the deskosctl tool image, not this binary.
  #
  version: 0.25.2
  source:
    url: https://github.com/deskosproject/deskos-core/releases/download/v0.25.2/deskos-v0.25.2-linux-amd64
    sha256: a7ff512ca4f69505c58974c71553b1faa6e6b5c28012fd0d64c73cbe90a9938a
  archive: none
  files:
    - destination: /usr/bin/deskos
      mode: "0755"
