apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: fedora
spec:
  # The Fedora family's own choice is the application channel it supports. It sits
  # here and not in the foundation for the reason ADR 0014 gives — composition
  # unions sets and offers no removal (ADR 0003), so a foundation that names it
  # forces it on every platform — and it is the Fedora family's, not the RHEL
  # family's, so PackageSet/rhel-family is not reused here.
  #
  # Measured on the Silverblue bases: firewalld 2.5.2 and flatpak 1.18.4 are already
  # in the image, and firewalld.service is already enabled, so naming either installs
  # nothing. The set keeps flatpak for a trimmer Fedora base; it does not name
  # firewalld, which the base and the workstation group already provide.
  #
  # Firefox is not here: DeskOS delivers it as the Flathub Flatpak (Profile/firefox)
  # on every flavor. The Silverblue base still carries its own Firefox RPM; removing
  # a base package is not something composition can express (ADR 0003), so the
  # vendor's RPM stays until a removal operation is modeled.
  packages:
    - flatpak
