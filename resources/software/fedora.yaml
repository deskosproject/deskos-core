apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: fedora
spec:
  # The Fedora family's own choices: the firewall it manages and the application
  # channel it supports. They sit here and not in the foundation for the reason
  # ADR 0014 gives — composition unions sets and offers no removal (ADR 0003), so a
  # foundation that names them forces them on every platform — and they are the
  # Fedora family's, not the RHEL family's, so PackageSet/rhel-family is not reused
  # here.
  #
  # Measured on the Silverblue bases, and deliberately different from the EL bases:
  # firewalld 2.5.2 and flatpak 1.18.4 are already in the image and
  # firewalld.service is already enabled, so `dnf5 -y install firewalld flatpak`
  # reports no packages to install. Naming them anyway keeps the family profile's
  # intent reviewable in one place and keeps a workstation on a trimmer Fedora base
  # working, since the packages are part of what this family requires rather than of
  # what this particular base happens to carry.
  #
  # Firefox is not here: DeskOS delivers it as the Flathub Flatpak (Profile/firefox)
  # on every flavor. The Silverblue base still carries its own Firefox RPM; removing
  # a base package is not something composition can express (ADR 0003), so the
  # vendor's RPM stays until a removal operation is modeled.
  packages:
    - firewalld
    - flatpak
  enableUnits:
    - firewalld.service
