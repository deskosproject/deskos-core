# The two families the platform does not package. Both are OFL, both come from
# Google Fonts at a pinned commit, and both land in the directory fontconfig
# reads (ADR 0018, amended 2026-10-29). The variable files are installed under
# names without the brackets their upstream file names carry, because a
# destination is a plain file name.
apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: gelasio
spec:
  # Georgia's metric-compatible replacement: fontconfig already maps Georgia to
  # Gelasio (30-metric-aliases.conf), so a document that asks for Georgia keeps
  # its line breaks.
  version: "1.0"
  source:
    url: https://raw.githubusercontent.com/google/fonts/a60a77e14f28abd4ef243a1b5dfc48df0cec5205/ofl/gelasio/Gelasio%5Bwght%5D.ttf
    sha256: 4daecea457258c9ebeb8bc99ed3fd24353618bfad3ea4b93fa0b5d0468fc04e4
  archive: none
  files:
    - destination: /usr/local/share/fonts/Gelasio.ttf
---
apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: gelasio-italic
spec:
  version: "1.0"
  source:
    url: https://raw.githubusercontent.com/google/fonts/a60a77e14f28abd4ef243a1b5dfc48df0cec5205/ofl/gelasio/Gelasio-Italic%5Bwght%5D.ttf
    sha256: 52559e845a4d33514e5f93bb9ae7dbeae1894a53f2c565a15f18af40cd337c09
  archive: none
  files:
    - destination: /usr/local/share/fonts/Gelasio-Italic.ttf
---
apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: gelasio-license
spec:
  # The licence travels beside the font, which is what the OFL asks for.
  version: "1.0"
  source:
    url: https://raw.githubusercontent.com/google/fonts/a60a77e14f28abd4ef243a1b5dfc48df0cec5205/ofl/gelasio/OFL.txt
    sha256: b393cb01867c919b44381512120dc3e4c954c7b47e2035c405f3a324799a4d29
  archive: none
  files:
    - destination: /usr/local/share/fonts/Gelasio-OFL.txt
---
apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: overpass
spec:
  # Red Hat's OFL sans, the family its own desktop look grew out of, and the one
  # a document exports as "Overpass".
  version: "4.0"
  source:
    url: https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/overpass/Overpass%5Bwght%5D.ttf
    sha256: 970717df17a7f9911dee45f60695d05bfa9d745fa0a11fc5c348371fa21f0073
  archive: none
  files:
    - destination: /usr/local/share/fonts/Overpass.ttf
---
apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: overpass-italic
spec:
  version: "4.0"
  source:
    url: https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/overpass/Overpass-Italic%5Bwght%5D.ttf
    sha256: 3b45ac4193930bbeb491b5c76227afd5991607712f0d16d6bc5d74db6bbd8172
  archive: none
  files:
    - destination: /usr/local/share/fonts/Overpass-Italic.ttf
---
apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: overpass-license
spec:
  version: "4.0"
  source:
    url: https://raw.githubusercontent.com/google/fonts/8b0a1d0f5983c89bc2b93f1b5fb55f9e252744b5/ofl/overpass/OFL.txt
    sha256: 86e5ff25c701ec446d20b1a85b02ee6d36de8503a7288a4c948f5459809af1f0
  archive: none
  files:
    - destination: /usr/local/share/fonts/Overpass-OFL.txt
