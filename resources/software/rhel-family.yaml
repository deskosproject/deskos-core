apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: rhel-family
spec:
  # The RHEL family's own choices: the firewall it manages and the application
  # channel it supports. These are platform facts, not foundation ones.
  #
  # They used to sit in the deskos-core PackageSet, where no organization could
  # take them back: composition unions sets and offers no removal (ADR 0003), so a
  # foundation that names them forces them on every platform. An Ubuntu
  # workstation does not want firewalld. Firefox is a Flatpak on every flavor
  # (Profile/firefox), so no family set carries its RPM.
  # ADR 0014 asks for these to leave the common foundation.
  #
  # firewalld is not named here: the workstation-product-environment group installs
  # it and enables it (measured on RHEL 10.2: firewalld 2.4.3, enabled and active,
  # with no explicit request). Naming it added nothing. The base image alone does
  # not carry it, so a workstation that installs no graphical group still needs its
  # own firewall decision.
  packages:
    - flatpak
