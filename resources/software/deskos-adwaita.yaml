# GNOME's own families, which EL10 does not package. Adwaita Sans is a variation
# of Inter and Adwaita Mono is Iosevka matched to it, both OFL, so a DeskOS image
# can carry the family GNOME OS ships and GNOME designs its apps with. Pinned at
# a commit of GNOME/adwaita-fonts; the release they belong to is 51.0.
apiVersion: software.deskos.org/v1alpha1
kind: BinaryArtifact
metadata:
  name: adwaita-sans
spec:
  version: "51.0"
  source:
    url: https://gitlab.gnome.org/GNOME/adwaita-fonts/-/raw/301f8351840087c0bcd5f3f97aae37b3734b8648/sans/AdwaitaSans-Regular.ttf
    sha256: 8381c33b9a44f066f2b99dba3d416a2342891e28c956a35dfd8d16ee2987e6d4
  archive: none
  files:
    - destination: /usr/local/share/fonts/AdwaitaSans-Regular.ttf
