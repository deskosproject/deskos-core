apiVersion: software.deskos.org/v1alpha1
kind: FlatpakSet
metadata:
  name: firefox
spec:
  # The reference workstations take Firefox from Flathub, which updates
  # independently of the image. RHEL 10 also keeps the Firefox RPM in AppStream
  # (10.2 release notes), so an organization that cannot reach a Flatpak remote at
  # runtime installs the vendor package in its own PackageSet instead.
  remote: flathub
  applications:
    - id: org.mozilla.firefox
      branch: stable
