apiVersion: desktop.deskos.org/v1alpha1
kind: GnomeProfile
metadata:
  name: deskos-core
spec:
  defaults:
    # GNOME Software offers updates but never downloads or applies them on its own.
    software:
      updates: manual
    session:
      idle:
        blankAfter: 10m
      lock:
        enabled: true
        delay: 0s
    # Wallpaper, login logo, window buttons, shell favorites and Dash to Dock are
    # deliberately absent. They are the platform's look and feel, or an
    # organization's choice, not the foundation's: Ubuntu ships its own GNOME
    # layout and its own artwork, and an organization that wants the DeskOS look
    # adds the deskos-look profile from its own layer.
