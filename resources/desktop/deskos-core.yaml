apiVersion: desktop.deskos.org/v1alpha1
kind: GnomeProfile
metadata:
  name: deskos-core
spec:
  defaults:
    # The same window controls on every flavor: minimize, maximize and close on the
    # right, and the top-left corner opens the overview. They are defaults, so an
    # organization that declares other buttons or no hot corner wins at its layer
    # (ADR 0003); the plan adds no app-menu token of its own (ADR 0016).
    windows:
      buttons: [minimize, maximize, close]
    shell:
      hotCorners: true
    # GNOME Software offers updates but never downloads or applies them on its own.
    software:
      updates: manual
    session:
      idle:
        blankAfter: 10m
      lock:
        enabled: true
        delay: 0s
    # Wallpaper, login logo, shell favorites and Dash to Dock are deliberately
    # absent. They are the workstation's look, or an organization's choice, not
    # the foundation's: an organization that wants its own wallpaper overrides it,
    # and one that wants the DeskOS artwork adds the deskos-look profile.
