apiVersion: desktop.deskos.org/v1alpha1
kind: GnomeProfile
metadata:
  name: deskos-tray
spec:
  defaults:
    # Tray icons: AppIndicator and KStatusNotifierItem support, from the platform's
    # own catalog (resources/platforms/<platform>.yaml). The decision names the
    # UUID; the platform catalog decides which package or pinned artifact provides
    # it, and a platform that does not declare it installs no package for it
    # (ADR 0017, ADR 0021).
    #
    # Referenced by Profile/deskos-gnome, so every GNOME workstation gets it.
    shell:
      extensions:
        - uuid: appindicatorsupport@rgcjonas.gmail.com
          enabled: true
