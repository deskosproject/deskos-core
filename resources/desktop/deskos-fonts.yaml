apiVersion: desktop.deskos.org/v1alpha1
kind: GnomeProfile
metadata:
  name: deskos-fonts
spec:
  defaults:
    appearance:
      fonts:
        # GNOME's default monospace is Source Code Pro, which EL10 does not
        # package: every terminal and every monospace field then falls back
        # silently to whatever matches first. The set installs DejaVu Sans Mono,
        # so the default names it.
        monospace: {family: DejaVu Sans Mono, size: 11}
        terminal: {family: DejaVu Sans Mono, size: 11}
