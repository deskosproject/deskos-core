apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: identity-client
spec:
  # The client side only. The image never carries a realm, a principal or a
  # password: joining is a runtime act, performed on the machine by a person or
  # by configuration management.
  packages:
    # The FreeIPA client.
    - ipa-client
    # The AD client: realmd runs the join, `sssd-ad` is the provider it
    # configures, and adcli stays because realmd reaches for it by default and
    # some domains need it. The join in the check names Samba's client
    # explicitly: adcli's machine-password exchange is what Samba 4.23+ refuses.
    # Without these the image can join FreeIPA and nothing else, which is what
    # the AD check found the hard way.
    - realmd
    - adcli
    - sssd-ad
    # realmd's discovery lists it as required for AD.
    - samba-common-tools
    # kinit and klist: the join waits for an authenticated exchange instead of a
    # DNS answer, and the report reads the keytab it produced.
    - krb5-workstation
    # The home policy both clients use.
    - oddjob-mkhomedir
