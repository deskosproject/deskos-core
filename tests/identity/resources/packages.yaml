apiVersion: software.deskos.org/v1alpha1
kind: PackageSet
metadata:
  name: identity-client
spec:
  # The client side only. The image never carries a realm, a principal or a
  # password: joining is a runtime act, performed on the machine by a person or
  # by configuration management.
  packages:
    # The FreeIPA client.
    - ipa-client
    # The AD client: realmd and adcli are what `realm join` runs, and sssd-ad is
    # the provider it configures. Without them the image can join FreeIPA and
    # nothing else, which is what the AD check found the hard way.
    - realmd
    - adcli
    - sssd-ad
    # realmd's discovery lists it as required for AD.
    - samba-common-tools
    # The home policy both clients use.
    - oddjob-mkhomedir
