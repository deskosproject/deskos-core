# Squid as a forward proxy: no cache, no interception (no ssl_bump). The client
# makes a CONNECT and validates the origin certificate itself, which is exactly
# what a corporate proxy without TLS inspection does.
http_port 3128

# A throwaway proxy with no cache and no auth. It does not restrict the source
# address or the port: the fixture is reached through a published port that need
# not match the one the guest asks for, and a restriction here would only add a
# way for the check to fail for the wrong reason.
http_access allow all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /run/squid.pid
