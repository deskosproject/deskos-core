# The intranet the machine is supposed to reach: plain on 8080, TLS on 8443 with
# a certificate signed by this run's private CA.
server {
    listen 8080;
    listen 8443 ssl;
    server_name intranet.corp.test;

    ssl_certificate     /pki/server.crt;
    ssl_certificate_key /pki/server.key;

    location / {
        default_type text/plain;
        return 200 "DESKOS-PROXY-OK\n";
    }
}
