name: promotion

# Moves one tested digest to `stable` without rebuilding it. The gate publishes
# `:<commit>`, `:latest` and `:candidate`; `stable` moves only here, after the
# keyless signature and the durable evidence are verified and an approval record
# is stored next to that evidence (docs/design/promotion.md).
#
# It runs by itself when the gate publishes, and on dispatch for a digest that
# was built earlier. The approval is still recorded, but nobody has to remember
# to press it: a cadence that depends on a person is not a cadence.
on:
  workflow_run:
    workflows: ["supply-chain"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      workstation:
        description: Platform repository under quay.io/deskos
        type: string
        default: deskos-core-centos-stream-10
      digest:
        description: Digest to promote, sha256 and 64 hex
        type: string
        required: true
      confirm:
        description: Repeat the digest exactly, to catch a typo
        type: string
        required: true
      from_channel:
        description: Channel that must already point at this digest
        type: string
        default: candidate
      reason:
        description: Why this digest is promoted
        type: string
        required: true
      approver:
        description: Person approving; defaults to the actor who dispatched
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: promotion
  cancel-in-progress: false

env:
  REGISTRY: quay.io/deskos
  GOTOOLCHAIN: local

jobs:
  promote:
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: evidence-write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the request
        env:
          DIGEST_INPUT: ${{ inputs.digest }}
          CONFIRM: ${{ inputs.confirm }}
          REASON: ${{ inputs.reason }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          station="${{ inputs.workstation }}"
          [ -n "$station" ] || station=deskos-core-centos-stream-10

          if [ "$EVENT" = "workflow_run" ]; then
            # The gate published this run; the digest is read from :candidate and
            # the reason names the run that produced it.
            REASON="automatic: the gate passed and published on main (run ${{ github.event.workflow_run.id }})"
            DIGEST_INPUT=""
            approve="automatic (gate)"
          else
            case "$DIGEST_INPUT" in
              sha256:*) ;;
              *) echo "::error::digest must start with sha256:"; exit 1 ;;
            esac
            printf '%s' "${DIGEST_INPUT#sha256:}" | grep -qE '^[0-9a-f]{64}$' \
              || { echo "::error::digest is not 64 lowercase hex characters"; exit 1; }
            [ "$DIGEST_INPUT" = "$CONFIRM" ] \
              || { echo "::error::confirm must repeat the digest exactly"; exit 1; }
            test -n "$REASON" || { echo "::error::a promotion needs a reason"; exit 1; }
            approve="${{ inputs.approver }}"
            [ -n "$approve" ] || approve="$GITHUB_ACTOR"
          fi
          {
            echo "DIGEST=$DIGEST_INPUT"
            echo "REPO=$REGISTRY/$station"
            echo "ISO_REPO=$REGISTRY/$station-iso"
            echo "STATION=$station"
            echo "REASON=$REASON"
            echo "APPROVER=$approve"
          } >> "$GITHUB_ENV"

      - name: Install skopeo, oras and jq
        env:
          ORAS_VERSION: v1.3.5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo jq
          # The installer is an OCI artifact, and skopeo refuses to inspect one;
          # oras is the client that understands it (same pin as the publish step).
          tmp="$(mktemp -d)"
          tgz="oras_${ORAS_VERSION#v}_linux_amd64.tar.gz"
          base="https://github.com/oras-project/oras/releases/download/${ORAS_VERSION}"
          curl -fsSL -o "$tmp/$tgz" "$base/$tgz"
          curl -fsSL -o "$tmp/oras_checksums.txt" "$base/oras_${ORAS_VERSION#v}_checksums.txt"
          ( cd "$tmp" && grep " $tgz\$" oras_checksums.txt | sha256sum --check --strict --quiet - )
          tar -xzf "$tmp/$tgz" -C "$tmp" oras
          sudo install -m 0755 "$tmp/oras" /usr/local/bin/oras
          oras version

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Log in to the registry
        env:
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          printf '%s' "$QUAY_ROBOT_TOKEN" \
            | skopeo login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          # oras keeps its own credential file; the ISO step uses it.
          printf '%s' "$QUAY_ROBOT_TOKEN" \
            | oras login quay.io -u "$QUAY_ROBOT_USERNAME" --password-stdin

      - name: Resolve the digest and skip when stable already serves it
        run: |
          set -euo pipefail
          if [ -z "${DIGEST:-}" ]; then
            DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:candidate")"
            echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          fi
          stable="$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:stable" 2>/dev/null || true)"
          if [ "$stable" = "$DIGEST" ]; then
            echo "stable already serves $DIGEST; nothing to promote"
            echo "SKIP=yes" >> "$GITHUB_ENV"
          fi

      - name: The channel serves this digest and it is signed
        if: env.SKIP != 'yes'
        env:
          SOURCE: ${{ inputs.from_channel || 'candidate' }}
        run: |
          set -euo pipefail
          source_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:$SOURCE")"
          [ "$source_digest" = "$DIGEST" ] \
            || { echo "::error::$SOURCE serves $source_digest, not $DIGEST"; exit 1; }
          # The identity is the publish workflow on main, not this repository:
          # a promotion must never make another workflow's signature acceptable.
          cosign verify "$REPO@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main'

      - name: The durable evidence is complete
        if: env.SKIP != 'yes'
        env:
          EVIDENCE_PUBLIC_BASE_URL: ${{ vars.EVIDENCE_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          base="${EVIDENCE_PUBLIC_BASE_URL%/}/deskos/$STATION/sha256/${DIGEST#sha256:}"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          curl -fsS "$base/index.json" -o "$evidence/index.json"
          jq -r '.objects[].name' "$evidence/index.json" | while read -r name; do
            mkdir -p "$evidence/$(dirname "$name")"
            curl -fsS "$base/$name" -o "$evidence/$name"
          done
          python3 tests/evidence/verify.py --index "$evidence/index.json" \
            --dir "$evidence" --digest "$DIGEST"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"

      - name: Record the approval
        if: env.SKIP != 'yes'
        env:
          EVIDENCE_S3_ENDPOINT: ${{ vars.EVIDENCE_S3_ENDPOINT }}
          EVIDENCE_S3_REGION: ${{ vars.EVIDENCE_S3_REGION }}
          EVIDENCE_S3_BUCKET: ${{ vars.EVIDENCE_S3_BUCKET }}
          EVIDENCE_S3_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_S3_ACCESS_KEY_ID }}
          EVIDENCE_S3_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_S3_SECRET_ACCESS_KEY }}
          SOURCE: ${{ inputs.from_channel || 'candidate' }}
        run: |
          set -euo pipefail
          previous="$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:stable" 2>/dev/null || true)"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          python3 tests/evidence/approvals.py --dir "$EVIDENCE" \
            --repository "$STATION" --image "$REPO" --digest "$DIGEST" \
            --from "$SOURCE" --to stable --previous "$previous" \
            --actor "$GITHUB_ACTOR" --approver "$APPROVER" --reason "$REASON" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --stamp "$stamp" --output approval.json
          echo "PREVIOUS=${previous:-none}" >> "$GITHUB_ENV"

      - name: Move stable by digest
        if: env.SKIP != 'yes'
        run: |
          set -euo pipefail
          # A tag move, never a build: this copies the manifest the signature is
          # about and preserves its digest.
          skopeo copy --preserve-digests "docker://$REPO@$DIGEST" "docker://$REPO:stable"
          moved="$(skopeo inspect --format '{{.Digest}}' "docker://$REPO:stable")"
          [ "$moved" = "$DIGEST" ] \
            || { echo "::error::stable is $moved, not $DIGEST"; exit 1; }
          cosign verify "$REPO:stable" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main'

      - name: Move the ISO stable when the gate published one
        if: env.SKIP != 'yes'
        run: |
          set -euo pipefail
          # The ISO is tagged by the image digest, because promotion knows the
          # digest and not the commit. No ISO for this digest is not an error: a
          # platform may publish an image without an installer.
          #
          # `skopeo inspect` cannot read an installer: it is an OCI artifact, and
          # skopeo answers "unsupported image-specific operation on artifact with
          # type …". That failure is indistinguishable from "no ISO published", so
          # this step would have left the ISO channel alone in silence, forever.
          tag="sha256-${DIGEST#sha256:}"
          if desc="$(oras manifest fetch --descriptor "$ISO_REPO:$tag" 2>"$RUNNER_TEMP/iso.err")"; then
            iso="$(jq -r .digest <<<"$desc")"
          else
            if grep -qiE 'not found|manifest unknown|NAME_UNKNOWN' "$RUNNER_TEMP/iso.err"; then
              echo "no ISO published for $DIGEST; the ISO channel is left alone"
              exit 0
            fi
            echo "::error::could not read $ISO_REPO:$tag" >&2
            cat "$RUNNER_TEMP/iso.err" >&2
            exit 1
          fi
          # The annotation is the link between the installer and the image it
          # carries; the tag name alone is a convention.
          annotated="$(oras manifest fetch "$ISO_REPO@$iso" \
            | jq -r '.annotations["org.deskos.image.digest"] // empty')"
          [ "$annotated" = "$DIGEST" ] || {
            echo "::error::$ISO_REPO:$tag is annotated ${annotated:-with nothing}, not $DIGEST"
            exit 1
          }
          cosign verify "$ISO_REPO@$iso" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main'
          # A tag move inside the repository, by digest, the same operation the
          # publish step uses: no re-push of bytes and no chance to invent a new
          # manifest.
          oras tag "$ISO_REPO@$iso" stable
          moved="$(oras manifest fetch --descriptor "$ISO_REPO:stable" | jq -r .digest)"
          [ "$moved" = "$iso" ] || { echo "::error::ISO stable is $moved, not $iso"; exit 1; }

      - name: Summary
        if: always()
        run: |
          {
            echo "### Promotion"
            echo '```json'
            cat approval.json 2>/dev/null || echo '{}'
            echo '```'
            echo "- previous stable: ${PREVIOUS:-unknown}"
            echo "- digest: ${DIGEST:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the approval record with the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: promotion-record-attempt-${{ github.run_attempt }}
          path: approval.json
          retention-days: 14
          if-no-files-found: warn

      - name: Log out of the registry
        if: always()
        run: |
          skopeo logout quay.io || true
          oras logout quay.io || true
