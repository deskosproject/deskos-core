name: docs-deploy

# The documentation site at docs.deskos.org, built from docs/ and website/.
#
# It is its own GitHub Pages site and not a directory of deskos.org: the
# marketing site is deliberately buildless ("no build step, no framework") and
# says that docs belong in the repository. The content and the site that renders
# it live here, so a page and its navigation are reviewed in one pull request.
#
# A pull request builds the site and uploads it; main deploys it. The Pages site
# is enabled in the repository settings with "GitHub Actions" as its source and
# docs.deskos.org as its custom domain (website/README.md, and the DNS record in
# deskos-infrastructure).
on:
  pull_request:
    paths:
      - docs/**
      - website/**
      - .github/workflows/docs-deploy.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - website/**
      - .github/workflows/docs-deploy.yml
  # A successful image boot check refreshes the screenshots on the QA page.
  # A failed run changes nothing: the last good images stay up, and the red
  # badge on the page points at the run that failed.
  workflow_run:
    workflows: [image-bootcheck]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The QA step downloads the artifacts of the run that triggered this one.
  actions: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # A failed image boot check has no frames worth showing; leave the site as
    # it is and let the next good run or a docs change deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      # `npm ci` installs exactly the lockfile, so a build here and a build on a
      # laptop are the same dependencies.
      - name: Install the site's dependencies
        run: npm ci --prefix website

      - name: Every docs page is in the sidebar or explicitly excluded
        # A page no sidebar links to is invisible on the site; a sidebar entry
        # with no page is a dead link. Both fail the build here.
        run: node website/tests/sidebar.cjs

      - name: Build the site
        run: npm run build --prefix website

      - name: Find the latest successful image boot check
        # A docs-only merge must not roll the gallery back to the images that
        # happen to be committed. Every build refreshes from the last successful
        # run; the workflow_run trigger only makes that happen immediately after
        # the run, instead of waiting for the next docs change.
        id: qa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow image-bootcheck.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // ""' || true)"
          echo "run-id=$id" >> "$GITHUB_OUTPUT"

      - name: Download the QA frames
        id: frames
        if: steps.qa.outputs.run-id != ''
        # Artifacts expire after 14 days. An old but successful run then has
        # nothing to download; the committed fallback is better than a failed
        # docs deploy, and the next image-changing merge refreshes the gallery.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          run-id: ${{ steps.qa.outputs.run-id }}
          pattern: vm-evidence-*-attempt-*
          path: qa-artifacts
          github-token: ${{ github.token }}

      - name: Put the latest screenshots on the QA page
        if: steps.frames.outcome == 'success'
        run: python3 tests/vm/gallery.py --artifacts qa-artifacts --out website/build/qa/latest

      # The Pages artifact is the built site. A pull request stops here: the
      # build is the check, and nothing is published from a branch.
      - name: Package the built site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # The token of this repository, scoped to Pages: no separate credential.
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
