name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    # Cheap checks only: no image builds, registry logins or QEMU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        # The assignment fails the step if gofmt cannot run.
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: VM boot check harness unit tests
        run: python3 -m unittest discover -s tests/vm
      - name: RHEL factory harness unit tests
        run: python3 -m unittest discover -s tests/rhel
      - name: supply-chain harness unit tests
        run: python3 -m unittest discover -s tests/supply-chain
      - name: build deskosctl
        run: go build -o bin/deskosctl ./cmd/deskosctl
      - name: validate resources and examples
        run: |
          for ex in baseline-and-role core-centos-stream-10 core-almalinux-10 core-rhel-10; do
            ./bin/deskosctl validate ./resources "./examples/$ex"
          done
      - name: plan CentOS reference workstation
        run: ./bin/deskosctl plan ./resources --workstation deskos-core-centos10
      - name: plan per-platform examples
        run: |
          ./bin/deskosctl plan ./resources ./examples/core-centos-stream-10 --workstation example-core-centos-stream-10
          ./bin/deskosctl plan ./resources ./examples/core-almalinux-10 --workstation example-core-almalinux-10
          ./bin/deskosctl plan ./resources ./examples/core-rhel-10 --workstation example-core-rhel-10
      - name: plan example RHEL workstation
        run: ./bin/deskosctl plan ./resources ./examples/baseline-and-role --workstation example-devops-rhel10
      - name: render twice and compare
        run: |
          for ws in deskos-core-centos10 example-devops-rhel10; do
            ./bin/deskosctl render ./resources ./examples/baseline-and-role --workstation "$ws" --output "dist/a/$ws"
            ./bin/deskosctl render ./examples/baseline-and-role ./resources --workstation "$ws" --output "dist/b/$ws"
          done
          diff -r dist/a dist/b
