name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    # Cheap checks only: no image builds, registry logins or QEMU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        # The assignment fails the step if gofmt cannot run.
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: VM boot check harness unit tests
        run: python3 -m unittest discover -s tests/vm
      - name: supply-chain harness unit tests
        run: python3 -m unittest discover -s tests/supply-chain
      - name: artifact check unit tests
        run: python3 -m unittest discover -s tests/artifacts
      - name: build deskosctl
        run: go build -o bin/deskosctl ./cmd/deskosctl
      - name: validate resources and examples
        run: |
          for ex in baseline-and-role core-centos-stream-10 core-almalinux-10 core-rhel-10 core-ubuntu-2604; do
            ./bin/deskosctl validate "./examples/$ex"
          done
      - name: plan CentOS reference workstation
        run: ./bin/deskosctl plan --workstation deskos-core-centos10
      - name: plan per-platform examples
        run: |
          ./bin/deskosctl plan ./examples/core-centos-stream-10 --workstation example-core-centos-stream-10
          ./bin/deskosctl plan ./examples/core-almalinux-10 --workstation example-core-almalinux-10
          ./bin/deskosctl plan ./examples/core-rhel-10 --workstation example-core-rhel-10
      - name: plan example RHEL workstation
        run: ./bin/deskosctl plan ./examples/baseline-and-role --workstation example-devops-rhel10
      - name: the pinned bases exist in their registries
        timeout-minutes: 10
        run: |
          # A base pinned by digest is a promise that its registry still serves
          # that digest, and publishing the base breaks it. On 2026-10-17 the
          # Ubuntu base was republished with a different digest, the platform kept
          # the old one, and every Ubuntu build answered `manifest unknown` for
          # over an hour — including a merge, because the VM legs do not gate it.
          # Nothing caught it earlier because the platform and its goldens pinned
          # the same stale digest: they agreed with each other while the registry
          # disagreed.
          #
          # Deliberately not a Go test and not part of `make check`: the compiler
          # and its tests must work with no network (AGENTS.md, invariant 11).
          # This is a CI step, and it only reads.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends skopeo >/dev/null
          python3 - <<'PY' > /tmp/pins.txt
          import glob, yaml
          for f in sorted(glob.glob('resources/platforms/*.yaml')):
              d = yaml.safe_load(open(f)) or {}
              b = (d.get('spec') or {}).get('bootc') or {}
              if b.get('image') and b.get('digest'):
                  print(f.split('/')[-1], b['image'], b['digest'])
          PY
          while read -r platform image digest; do
            err="$(sudo skopeo inspect "docker://$image@$digest" 2>&1 >/dev/null || true)"
            case "$err" in
              "")
                echo "ok        $platform  $image@${digest:0:19}…" ;;
              *"manifest unknown"*|*"not found"*)
                echo "::error::$platform pins $image@$digest, which its registry does not serve any more. Re-pin it to the digest the registry serves."
                exit 1 ;;
              *"unauthorized"*|*"authentication required"*|*"denied"*|*"credentials"*)
                # An entitled registry (RHEL) cannot be checked anonymously, and
                # `unauthorized` does not distinguish private from absent: report
                # it and claim neither.
                echo "unchecked $platform  $image@${digest:0:19}… (registry needs credentials)" ;;
              *)
                echo "::error::$platform could not be checked: $err"
                exit 1 ;;
            esac
          done < /tmp/pins.txt
      - name: render twice and compare
        run: |
          # The embedded Core, twice (determinism), and a Core passed in two
          # orders with --no-core (order independence), all identical.
          for ws in deskos-core-centos10 example-devops-rhel10; do
            ./bin/deskosctl render ./examples/baseline-and-role --workstation "$ws" --output "dist/a/$ws"
            ./bin/deskosctl render ./examples/baseline-and-role --workstation "$ws" --output "dist/b/$ws"
            ./bin/deskosctl render --no-core ./resources ./examples/baseline-and-role --workstation "$ws" --output "dist/c/$ws"
            ./bin/deskosctl render --no-core ./examples/baseline-and-role ./resources --workstation "$ws" --output "dist/d/$ws"
          done
          # The AlmaLinux example renders too: its platform is shipped.
          ./bin/deskosctl render ./examples/core-almalinux-10 --workstation example-core-almalinux-10 --output dist/alma
          # The AlmaLinux reference workstation renders too: it is what the
          # publish path builds, and its Containerfile is pinned by a golden.
          ./bin/deskosctl render --workstation deskos-core-almalinux10 --output dist/alma-ref
          # The Fedora reference workstation renders: its platform is shipped and its
          # Containerfile is pinned by a golden, so a Fedora fact that stops rendering
          # fails here rather than in a build nobody runs on a pull request.
          ./bin/deskosctl render --workstation deskos-core-fedora44 --output dist/fedora44
          # The Ubuntu reference renders too: it is what its publish leg builds,
          # and its context is pinned by a golden.
          ./bin/deskosctl render --workstation deskos-core-ubuntu2604 --output dist/ubuntu-ref
          diff -r dist/a dist/b
          diff -r dist/a dist/c
          diff -r dist/a dist/d
