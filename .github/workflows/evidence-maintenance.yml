name: evidence-maintenance

# Repairs and garbage-collects the digest-keyed evidence store. Dispatch only,
# main only, and it needs the `evidence-write` environment because that holds
# the upload credential.
#
#   backfill  downloads one run's durable artifact and publishes it for the
#             digest the artifact names. This is the recovery path when the
#             evidence job failed after the image was published.
#   prune     deletes a digest prefix that never became valid, such as an upload
#             that died before it wrote index.json. A prefix that has an index
#             is refused unless `force` is set: every published digest keeps its
#             evidence (docs/design/evidence-retention.md).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to do
        type: choice
        options: [prune, backfill]
        default: prune
      digest:
        description: Image digest, sha256 prefixed
        type: string
        required: true
      namespace:
        description: Evidence namespace
        type: string
        default: deskos
      repository:
        description: Evidence repository
        type: string
        default: deskos-core-centos-stream-10
      run_id:
        description: Backfill only, the run that holds the durable artifact
        type: string
        default: ""
      artifact:
        description: Backfill only, the durable artifact name
        type: string
        default: ""
      apply:
        description: Prune only, delete instead of listing
        type: boolean
        default: false
      force:
        description: Prune only, allow deleting a prefix that has an index
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: evidence-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: evidence-write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the durable artifact
        if: inputs.mode == 'backfill'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
          path: durable
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Backfill the digest
        if: inputs.mode == 'backfill'
        env:
          EVIDENCE_S3_ENDPOINT: ${{ vars.EVIDENCE_S3_ENDPOINT }}
          EVIDENCE_S3_REGION: ${{ vars.EVIDENCE_S3_REGION }}
          EVIDENCE_S3_BUCKET: ${{ vars.EVIDENCE_S3_BUCKET }}
          EVIDENCE_PUBLIC_BASE_URL: ${{ vars.EVIDENCE_PUBLIC_BASE_URL }}
          EVIDENCE_S3_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_S3_ACCESS_KEY_ID }}
          EVIDENCE_S3_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.artifact }}"
          digest="$(tr -d '\r\n' < durable/digest.txt)"
          test -n "$digest"
          # The artifact names its own digest; a mismatch means the wrong run.
          test "$digest" = "${{ inputs.digest }}"
          namespace="${{ inputs.namespace }}"
          repository="${{ inputs.repository }}"
          python3 tests/evidence/upload.py --dir durable --digest "$digest" \
            --namespace "$namespace" --repository "$repository" --public
          base="${EVIDENCE_PUBLIC_BASE_URL%/}/$namespace/$repository/sha256/${digest#sha256:}"
          tmp="$(mktemp -d)"
          curl -fsS "$base/index.json" -o "$tmp/index.json"
          jq -r '.objects[].name' "$tmp/index.json" | while read -r name; do
            mkdir -p "$tmp/$(dirname "$name")"
            curl -fsS "$base/$name" -o "$tmp/$name"
          done
          python3 tests/evidence/verify.py --index "$tmp/index.json" --dir "$tmp" \
            --digest "$digest"

      - name: Prune the digest prefix
        if: inputs.mode == 'prune'
        env:
          EVIDENCE_S3_ENDPOINT: ${{ vars.EVIDENCE_S3_ENDPOINT }}
          EVIDENCE_S3_REGION: ${{ vars.EVIDENCE_S3_REGION }}
          EVIDENCE_S3_BUCKET: ${{ vars.EVIDENCE_S3_BUCKET }}
          EVIDENCE_S3_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_S3_ACCESS_KEY_ID }}
          EVIDENCE_S3_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          digest="${{ inputs.digest }}"
          namespace="${{ inputs.namespace }}"
          repository="${{ inputs.repository }}"
          prefix="$namespace/$repository/sha256/${digest#sha256:}"
          args=(--namespace "$namespace" --repository "$repository"
                --digest "$digest" --confirm "$prefix")
          if [ "${{ inputs.apply }}" = "true" ]; then args+=(--apply); fi
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          python3 tests/evidence/prune.py "${args[@]}"
