name: release

# A pushed tag vX.Y.Z (optionally vX.Y.Z-<prerelease>) runs the CI checks,
# builds deskosctl for linux/amd64, packs the DeskOS resources of the same
# commit and creates a GitHub Release with both and SHA256SUMS. Nothing
# else is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - name: Require a semver tag
        id: semver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          [[ "$TAG" =~ $re ]] || { echo "::error::$TAG is not vX.Y.Z or vX.Y.Z-<prerelease>"; exit 1; }
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build deskosctl for linux/amd64
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p release
          asset="deskosctl-${TAG}-linux-amd64"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG} -X main.commit=${GITHUB_SHA}" -o "release/$asset" ./cmd/deskosctl
          out=$("release/$asset" version)
          echo "$out"
          [ "$out" = "deskosctl ${TAG} (commit ${GITHUB_SHA})" ]
          # The runtime companion, same commit, same checks: it reads the plan an
          # image carries instead of building one (docs/adr/0018).
          runtime="deskos-${TAG}-linux-amd64"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG} -X main.commit=${GITHUB_SHA}" -o "release/$runtime" ./cmd/deskos
          out=$("release/$runtime" version)
          echo "$out"
          [ "$out" = "deskos ${TAG} (commit ${GITHUB_SHA})" ]
          # Resources of the same commit; reproducible archive (sorted, commit time, no owner, no gzip name or time).
          resources="deskos-core-resources-${TAG}.tar.gz"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -cf - resources | gzip -9n > "release/$resources"
          mkdir -p /tmp/check && tar -xzf "release/$resources" -C /tmp/check
          # The tar is the Core the binary carries: validate it standalone and
          # prove it is byte for byte what core export writes.
          "release/$asset" validate --no-core /tmp/check/resources
          mkdir -p /tmp/embedded && "release/$asset" core export /tmp/embedded
          diff -r /tmp/embedded/resources /tmp/check/resources
          # Version-less aliases, so releases/latest/download/<name> works
          # without knowing the tag.
          cp "release/$asset" release/deskosctl-linux-amd64
          cp "release/$runtime" release/deskos-linux-amd64
          cp "release/$resources" release/deskos-core-resources.tar.gz
          (cd release && sha256sum "$asset" "$runtime" "$resources" deskosctl-linux-amd64 deskos-linux-amd64 deskos-core-resources.tar.gz > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release/
          retention-days: 1
          if-no-files-found: error

  tool:
    # The same binary as a container: scratch + deskosctl. A pipeline runs the
    # compiler without installing it. It is a release artifact like the binary,
    # so pushing a tag publishes it; it is scanned and signed before :latest
    # moves.
    # The `needs` context only exposes direct dependencies, so `tag` is listed
    # beside `ci`: the job reads needs.tag.outputs.prerelease to decide whether
    # this release may move :latest.
    needs: [tag, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Keyless cosign: the workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the tool image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          podman build -t quay.io/deskos/deskosctl:"$TAG" \
            --build-arg VERSION="$TAG" --build-arg COMMIT="$GITHUB_SHA" .
          out="$(podman run --rm quay.io/deskos/deskosctl:"$TAG" version)"
          echo "$out"
          [ "$out" = "deskosctl ${TAG} (commit ${GITHUB_SHA})" ]

      - name: Smoke the image a pipeline would run
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # `version` alone does not exercise the compiler, and this image is the
          # release artifact a pipeline runs, so validate the embedded Core and
          # render a workstation that ships with it.
          podman run --rm quay.io/deskos/deskosctl:"$TAG" validate
          mkdir -p smoke-out
          podman run --rm -v "$PWD/smoke-out:/out:z" \
            quay.io/deskos/deskosctl:"$TAG" render \
            --workstation deskos-core-centos-stream-10 --output /out
          test -f smoke-out/Containerfile

      - name: Install Syft and Grype (pinned)
        env:
          SYFT_VERSION: v1.55.0
          SYFT_INSTALL: b254e6d92f28c3868a755f62fb3ca8f26e9fee76
          GRYPE_VERSION: v0.120.1
          GRYPE_INSTALL: 6f8d854af29d3a3086b11a84afa51554a2a245fe
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/$SYFT_INSTALL/install.sh" | sh -s -- -b "$HOME/.local/bin" "$SYFT_VERSION"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/$GRYPE_INSTALL/install.sh" | sh -s -- -b "$HOME/.local/bin" "$GRYPE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan the tool image
        run: |
          podman save --format oci-archive -o tool.tar quay.io/deskos/deskosctl:"${{ github.ref_name }}"
          syft "oci-archive:tool.tar" -o cyclonedx-json=tool.sbom.cdx.json
          grype "oci-archive:tool.tar" -o table | tee tool-grype.txt
          grype "oci-archive:tool.tar" --fail-on critical -o table > /dev/null

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Push, sign and verify
        env:
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
          DEST: quay.io/deskos/deskosctl
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          printf '%s' "$QUAY_ROBOT_TOKEN" | podman login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          # The immutable tag first; :latest moves only after the digest is
          # signed and verified.
          podman push --digestfile digest.txt "$DEST:$TAG"
          digest="$(tr -d '\n\r' < digest.txt)"
          ref="$DEST@$digest"
          printf '%s' "$QUAY_ROBOT_TOKEN" | cosign login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          cosign sign --yes "$ref"
          cosign verify "$ref" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/deskosproject/deskos-core/' | tee cosign-verify.txt
          if [ "$PRERELEASE" = "false" ]; then
            # :latest is the newest stable release; a prerelease must not move
            # it, the same way GitHub's own "latest release" excludes them.
            podman tag "quay.io/deskos/deskosctl:$TAG" "$DEST:latest"
            # And it must be the digest that was signed, not merely a tag that
            # points somewhere: a registry returning another digest would mean
            # the signature is about a different image.
            podman push --digestfile latest-digest.txt "$DEST:latest"
            latest="$(tr -d '\n\r' < latest-digest.txt)"
            [ "$latest" = "$digest" ] || { echo "::error::$DEST:latest is $latest, not the signed $digest"; exit 1; }
            echo "Published and signed $ref, and moved :latest to it" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Prerelease $TAG: published and signed $ref; :latest unchanged" >> "$GITHUB_STEP_SUMMARY"
          fi
          podman logout quay.io

      - name: Upload the tool image evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tool-image-evidence
          path: |
            tool.sbom.cdx.json
            tool-grype.txt
            digest.txt
            cosign-verify.txt
          retention-days: 14
          if-no-files-found: warn

  release:
    needs: [tag, build, tool]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tags and history: the notes list what changed since the previous tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          (cd release && sha256sum -c SHA256SUMS)
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi

          # Short, and written to a file: a note is not a manual, and backticks
          # inside --notes "..." are command substitution that empties the text
          # (v0.18.0 shipped "is ; likewise is , is and is ."). The detail of
          # migrating lives in docs/migrations.md and is linked, once.
          notes="$(mktemp)"
          previous="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            all="$(git log --no-merges --format='%s' "${previous}..${TAG}" \
              | grep -E '^(feat|fix|perf)(\(|:|!)' | grep -v '^chore' || true)"
            [ -n "$all" ] || all="$(git log --no-merges --format='%s' "${previous}..${TAG}" || true)"
          else
            all=""
          fi
          total="$(printf '%s\n' "$all" | grep -c . || true)"

          # Five lines, features and fixes only: a release note is not a changelog
          # and not a manual. The rest is one link away.
          {
            echo "deskosctl ${TAG} (builds an image) and deskos ${TAG} (runs on a machine), for linux/amd64, with the DeskOS resources."
            echo "deskosctl is also published as a scanned, signed container at \`quay.io/deskos/deskosctl:${TAG}\`; verify the downloads with \`sha256sum -c SHA256SUMS\`."
            echo
            echo "### Changes"
            echo
            if [ "${total:-0}" -gt 0 ]; then
              printf '%s\n' "$all" | head -5 | sed 's/^/- /'
              if [ "$total" -gt 5 ]; then
                echo
                echo "and $((total-5)) more — [full list](https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG})."
              fi
            else
              echo "- first tagged release"
            fi
            echo
            echo "Moving from an older release? [docs/migrations.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/migrations.md)."
          } > "$notes"

          gh release create "$TAG" \
            release/deskosctl-"$TAG"-linux-amd64 release/deskos-"$TAG"-linux-amd64 \
            release/deskos-core-resources-"$TAG".tar.gz \
            release/deskosctl-linux-amd64 release/deskos-linux-amd64 release/deskos-core-resources.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$notes" \
            "${flags[@]}"
