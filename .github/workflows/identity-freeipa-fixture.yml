name: identity-freeipa-fixture

# Daily check of the disposable FreeIPA fixture, not of a DeskOS machine.
# It starts the pinned server image, waits for ipactl, creates one directory
# user and keeps the logs. Booting the identity image, joining it and logging in
# at GDM is the next phase; this workflow proves the fixture itself.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  # Identity-only paths, so the fixture can be exercised before it is merged
  # and when the fixture itself changes; it is not a per-pull-request check.
  pull_request:
    paths:
      - .github/workflows/identity-freeipa-fixture.yml
      - tests/identity/**

permissions:
  contents: read

concurrency:
  group: identity-freeipa-fixture
  cancel-in-progress: false

env:
  FREEIPA_IMAGE: freeipa/freeipa-server@sha256:208427caf7bb4b721b0d2858517be1ee4e8addfb625e7fcf48119c34e0cbeb58

jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman openssl

      - name: Start the disposable server
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "FREEIPA_PASSWORD=$password" >> "$GITHUB_ENV"
          sudo -E tests/identity/freeipa.sh start

      - name: Wait for the server
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if sudo tests/identity/freeipa.sh status; then
              exit 0
            fi
            sleep 10
          done
          sudo podman logs deskos-freeipa || true
          exit 1

      - name: Create a directory user
        run: |
          set -euo pipefail
          export FREEIPA_USER=qa
          user_password="$(openssl rand -hex 24)"
          echo "::add-mask::$user_password"
          echo "FREEIPA_USER_PASSWORD=$user_password" >> "$GITHUB_ENV"
          sudo -E tests/identity/freeipa.sh user
          sudo podman exec deskos-freeipa ipa user-show qa

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          sudo tests/identity/freeipa.sh status > evidence/ipactl.txt 2>&1 || true
          sudo podman logs deskos-freeipa > evidence/container.log 2>&1 || true
          sudo podman inspect freeipa --format '{{.Image}}' > evidence/image.txt 2>&1 || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: identity-freeipa-fixture
          path: evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Stop the container
        if: always()
        run: sudo tests/identity/freeipa.sh purge || true
