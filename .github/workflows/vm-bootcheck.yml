name: vm-bootcheck (experimental)

# Manual only. Builds DeskOS Core for CentOS Stream 10 from this checkout,
# makes a QCOW2, runs tests/vm/bootcheck.py on the unmodified disk, then
# tests/vm/sessioncheck.py on an instrumented boot of the same disk; a disk that
# passes both is uploaded as a temporary download artifact. Nested
# virtualization on GitHub-hosted runners is not officially supported, so a
# failure here is not by itself evidence of an artifact defect.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-bootcheck
  cancel-in-progress: false

env:
  IMAGE: localhost/deskos-core-centos10:ci
  # bootc-image-builder pinned to the digest used for local test disks.
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  WORK: /mnt/deskos-work

jobs:
  core-centos10:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render the Core build context
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render ./resources --workstation deskos-core-centos10 --output ctx
          sha256sum ctx/plan.json ctx/generated-manifest.json

      - name: Put container storage and outputs on /mnt
        # The root disk is small; the same layout as bootc-image-builder's own CI.
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          sudo chown "$(id -u):$(id -g)" "$WORK"

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Build the image
        timeout-minutes: 40
        run: sudo podman build --pull=missing -t "$IMAGE" ctx

      - name: Record image evidence
        run: |
          mkdir -p "$WORK/evidence"
          cp ctx/plan.json ctx/generated-manifest.json "$WORK/evidence/"
          grep '^FROM ' ctx/Containerfile > "$WORK/evidence/base.txt"
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}} digest={{.Digest}} created={{.Created}}' | tee "$WORK/evidence/image.txt"
          sudo podman run --rm --network=none "$IMAGE" rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$WORK/evidence/rpm-qa.txt"
          cat "$WORK/evidence/base.txt"
          wc -l < "$WORK/evidence/rpm-qa.txt"

      - name: Build a QCOW2 without the builder's kernel arguments
        timeout-minutes: 30
        run: |
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v "$WORK/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type qcow2 --no-default-kernel-args \
            --chown "$(id -u):$(id -g)" "$IMAGE"
          qemu-img check "$WORK/output/qcow2/disk.qcow2"
          sha256sum "$WORK/output/qcow2/disk.qcow2" | tee "$WORK/evidence/qcow2.sha256"
          df -h / /mnt

      - name: Boot check (unmodified disk)
        id: boot
        timeout-minutes: 15
        run: |
          python3 tests/vm/bootcheck.py --disk "$WORK/output/qcow2/disk.qcow2" \
            --out "$WORK/bootcheck" --expect-splash --hash-disk --keep-overlay \
            --boot-timeout 420 --shutdown-timeout 120

      - name: Journal of the failed boot (diagnostic boot of the kept overlay)
        if: failure() && steps.boot.outcome == 'failure'
        timeout-minutes: 15
        run: |
          python3 tests/vm/sessioncheck.py --mode journal --disk "$WORK/bootcheck/overlay.qcow2" \
            --out "$WORK/journal-failed-boot" --boot-timeout 600

      - name: Session check (instrumented boot)
        id: session
        timeout-minutes: 25
        run: |
          python3 tests/vm/sessioncheck.py --mode session --disk "$WORK/output/qcow2/disk.qcow2" \
            --plan "$WORK/evidence/plan.json" --out "$WORK/session" --boot-timeout 900

      # Only a disk that passed the boot and session checks is offered for download.
      - name: Prepare the QCOW2 download
        id: download
        if: success() && steps.boot.outcome == 'success' && steps.session.outcome == 'success'
        run: |
          name="deskos-core-centos10-qcow2-${GITHUB_SHA::12}-run${GITHUB_RUN_ID}"
          dir="$WORK/download/$name"
          mkdir -p "$dir"
          mv "$WORK/output/qcow2/disk.qcow2" "$dir/disk.qcow2"
          (cd "$dir" && sha256sum disk.qcow2 > disk.qcow2.sha256)
          [ "$(cut -d' ' -f1 "$dir/disk.qcow2.sha256")" = "$(cut -d' ' -f1 "$WORK/evidence/qcow2.sha256")" ]
          OUT="$dir/provenance.json" python3 - <<'EOF'
          import datetime, hashlib, json, os
          work = os.environ["WORK"]
          def sha(p):
              return hashlib.sha256(open(p, "rb").read()).hexdigest()
          def result(p):
              return json.load(open(p))["result"]
          image = dict(kv.split("=", 1) for kv in open(f"{work}/evidence/image.txt").read().split() if "=" in kv)
          prov = {
              "workstation": "deskos-core-centos10",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "created_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "plan_sha256": sha(f"{work}/evidence/plan.json"),
              "manifest_sha256": sha(f"{work}/evidence/generated-manifest.json"),
              "base": open(f"{work}/evidence/base.txt").read().strip(),
              "image_id": image.get("id"),
              "bootc_image_builder": os.environ["BIB"],
              "qcow2_sha256": open(os.path.join(os.path.dirname(os.environ["OUT"]), "disk.qcow2.sha256")).read().split()[0],
              "bootcheck": result(f"{work}/bootcheck/summary.json"),
              "sessioncheck": result(f"{work}/session/session.json"),
              "note": "Observed identities of this build; RPM content is not pinned, so rebuilds are not bit-for-bit identical.",
          }
          if (prov["bootcheck"], prov["sessioncheck"]) != ("pass", "pass"):
              raise SystemExit(f"refusing to package a disk with bootcheck={prov['bootcheck']} sessioncheck={prov['sessioncheck']}")
          json.dump(prov, open(os.environ["OUT"], "w"), indent=2)
          open(os.environ["OUT"], "a").write("\n")
          EOF
          cat "$dir/provenance.json"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload the QCOW2 (tested disk, temporary download)
        if: success() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.download.outputs.name }}
          path: ${{ steps.download.outputs.dir }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          for f in "$WORK/bootcheck/summary.md" "$WORK/session/session.md" "$WORK/journal-failed-boot/session.md"; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload boot check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-evidence-core-centos10
          path: |
            ${{ env.WORK }}/evidence
            ${{ env.WORK }}/bootcheck
            ${{ env.WORK }}/session
            ${{ env.WORK }}/journal-failed-boot
            !${{ env.WORK }}/**/*.qcow2
          retention-days: 14
          if-no-files-found: warn
