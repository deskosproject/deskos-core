            done
            [ "$ok" = 1 ] || { echo "could not pull $ref after 5 attempts" >&2; exit 1; }
          done

      - name: Build the image
        timeout-minutes: 40
        run: sudo podman build --pull=never -t "$IMAGE" ctx

      - name: Record image evidence
        run: |
          mkdir -p "$WORK/evidence"
          cp ctx/plan.json ctx/generated-manifest.json "$WORK/evidence/"
          grep '^FROM ' ctx/Containerfile > "$WORK/evidence/base.txt"
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}} digest={{.Digest}} created={{.Created}}' | tee "$WORK/evidence/image.txt"
          sudo podman run --rm --network=none "$IMAGE" rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$WORK/evidence/rpm-qa.txt"
          cat "$WORK/evidence/base.txt"

      - name: Build a QCOW2 without the builder's kernel arguments
        timeout-minutes: 30
        run: |
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=never \
