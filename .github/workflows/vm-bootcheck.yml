        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-evidence-core-fedora-45
          path: |
            ${{ env.WORK }}/evidence
            ${{ env.WORK }}/bootcheck
            ${{ env.WORK }}/session
            ${{ env.WORK }}/firstboot
            !${{ env.WORK }}/**/*.qcow2
          retention-days: 14
          if-no-files-found: warn
