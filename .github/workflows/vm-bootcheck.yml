  core-fedora-45:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # The example, not a shipped reference: the platform is shipped and the
      # example is what exercises it. Its profiles keep Fedora's own wallpaper and
      # splash, so the boot check runs without --expect-splash.
      WS: example-fedora-45
      ROOT: examples/fedora-45
      IMAGE: localhost/example-fedora-45:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render the build context
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render "$ROOT" --workstation "$WS" --output ctx
          sha256sum ctx/plan.json ctx/generated-manifest.json

      - name: Put container storage and outputs on /mnt
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
