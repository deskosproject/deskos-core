name: vm-bootcheck (experimental)

# Boots the artifact and asks the guest what it did, per platform.
#
# For CentOS Stream 10: builds the image from this checkout and from the
# organization example, makes a QCOW2 without the builder's kernel arguments for
# each, runs tests/vm/bootcheck.py on the unmodified disk, then
# tests/vm/sessioncheck.py on an instrumented boot of the same disk, then
# tests/vm/firstbootcheck.py, which is the one that answers whether the first-boot wizard
# ran and whether any account could log in. Booting example-devops-centos10 is what
# builds and boots an image with four declared RpmRepository sources enabled and
# the requested packages installed, not which source each package came from.
#
# For AlmaLinux 10 the same path builds the platform's example, whose platform is
# shipped, into a QCOW2 and boots it; the example keeps AlmaLinux's own look, so
# the boot check runs without --expect-splash.
#
# For Ubuntu 26.04 there is no published image to hand to bootc-image-builder, so the disk
# is written by `bootc install to-disk` out of a compressed OCI layout, which is the
# recipe the platform's own base documents. That disk has no DeskOS splash, so the boot
# check runs without --expect-splash, and the first-boot check is the one that says
# whether the artifact is usable.
#
# Runs on pull requests that can change an image, and on main. It is a check: the QCOW2 and
# the raw disk are test input and are not uploaded; the only publish path is
# supply-chain.yml. Nested virtualization on GitHub-hosted runners is not officially
# supported, so a failure here is not by itself evidence of an artifact defect — but it has
# worked, and /dev/kvm is enabled below the same way it has been since the first run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "resources/**"
      - "examples/**"
      - "internal/**"
      - "cmd/**"
      - "schemas/**"
      - "go.mod"
      - "tests/vm/**"
      - ".github/workflows/vm-bootcheck.yml"
  push:
    branches: [main]
    paths:
      - "resources/**"
      - "examples/**"
      - "internal/**"
      - "cmd/**"
      - "schemas/**"
      - "go.mod"
      - "tests/vm/**"
      - ".github/workflows/vm-bootcheck.yml"

permissions:
  contents: read

concurrency:
  group: vm-bootcheck-${{ github.ref }}
  cancel-in-progress: false

env:
  WORK: /mnt/deskos-work
  # bootc-image-builder pinned to the digest used for local test disks.
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  # No base image is named here on purpose: each job pulls what its own rendered
  # Containerfile says FROM, which is the platform's digest pin and not a tag this file
  # would have to keep in step with.

jobs:
  core-centos10:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      # The two are independent checks: one failing should not hide the other.
      fail-fast: false
      matrix:
        # The Core workstation, whose root is the embedded Core, and the
        # organization example, which declares four RpmRepository sources. Booting
        # the second is what builds and boots an image with those sources enabled:
        # dnf resolves them and installs the packages with GPG checking. It proves
        # the transaction succeeds, not which source each package came from, and it
        # does not claim the example's virt-manager requirement is met
        # (see examples/baseline-and-role/README.md).
        include:
          - workstation: deskos-core-centos10
            root: ""
            artifact: vm-evidence-core-centos10
            image: localhost/deskos-core-centos10:ci
          - workstation: example-devops-centos10
            root: examples/baseline-and-role
            artifact: vm-evidence-example-devops-centos10
            image: localhost/example-devops-centos10:ci
    env:
      WS: ${{ matrix.workstation }}
      ROOT: ${{ matrix.root }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render the build context
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          # ROOT is empty for the Core workstation, whose root is the embedded Core.
          ./bin/deskosctl render $ROOT --workstation "$WS" --output ctx
          sha256sum ctx/plan.json ctx/generated-manifest.json

      - name: Put container storage and outputs on /mnt
        # The root disk is small; the same layout as bootc-image-builder's own CI.
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          sudo chown "$(id -u):$(id -g)" "$WORK"

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Pull the base and the builder, retrying a flaky registry
        run: |
          # quay.io's CDN returned an EOF in the middle of a layer while this was being
          # written (2026-10-18), and losing a build of this length to a pull that had
          # nothing wrong with it is losing the work of the whole job. The retry is
          # explicit and bounded, and the build below runs with --pull=never: what it
          # uses is what arrived, so a failure there is a real one.
          base=$(grep -m1 '^FROM ' ctx/Containerfile | awk '{print $2}')
          for ref in "$base" "$BIB"; do
            ok=0
            for i in 1 2 3 4 5; do
              if sudo podman pull "$ref"; then ok=1; break; fi
              echo "attempt $i failed pulling $ref; retrying in 20s" >&2
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "could not pull $ref after 5 attempts" >&2; exit 1; }
          done

      - name: Build the image
        timeout-minutes: 40
        run: sudo podman build --pull=never -t "$IMAGE" ctx

      - name: Record image evidence
        run: |
          mkdir -p "$WORK/evidence"
          cp ctx/plan.json ctx/generated-manifest.json "$WORK/evidence/"
          grep '^FROM ' ctx/Containerfile > "$WORK/evidence/base.txt"
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}} digest={{.Digest}} created={{.Created}}' | tee "$WORK/evidence/image.txt"
          sudo podman run --rm --network=none "$IMAGE" rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$WORK/evidence/rpm-qa.txt"
          cat "$WORK/evidence/base.txt"
          wc -l < "$WORK/evidence/rpm-qa.txt"

      - name: Build a QCOW2 without the builder's kernel arguments
        timeout-minutes: 30
        run: |
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=type:unconfined_t \
            -v "$WORK/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type qcow2 --no-default-kernel-args \
            --chown "$(id -u):$(id -g)" "$IMAGE"
          qemu-img check "$WORK/output/qcow2/disk.qcow2"
          sha256sum "$WORK/output/qcow2/disk.qcow2" | tee "$WORK/evidence/qcow2.sha256"
          df -h / /mnt

      - name: Boot check (unmodified disk)
        id: boot
        timeout-minutes: 20
        run: |
          # The DeskOS splash is plymouth drawing on the emulated display, and
          # the first boot of a fresh disk races with it: measured on one and the
          # same disk, the first boot showed the text console for the whole boot
          # and the second drew the splash at 12.4 s (the frames are in the
          # evidence of both). The assertion is unchanged — the disk must show
          # the splash — and a race gets one more boot, with the failed attempt
          # kept beside the retry so neither is hidden.
          check() {
            python3 tests/vm/bootcheck.py --disk "$WORK/output/qcow2/disk.qcow2" \
              --out "$1" --expect-splash --hash-disk --keep-overlay \
              --boot-timeout 420 --shutdown-timeout 120
          }
          if check "$WORK/bootcheck"; then
            exit 0
          fi
          # Only the splash failure is retried, and only when it is the whole list:
          # the summary is structured, so this reads the list rather than a
          # rendered page, and a run that failed for anything else fails here.
          if ! python3 -c "import json,sys; f=json.load(open(sys.argv[1])).get('failures',[]); sys.exit(0 if f==['the graphical boot splash never appeared'] else 1)" "$WORK/bootcheck/summary.json"; then
            echo 'the boot check failed for something other than the splash alone' >&2
            exit 1
          fi
          echo "::warning::the splash did not appear on the first boot; booting again"
          mv "$WORK/bootcheck" "$WORK/bootcheck-attempt1"
          check "$WORK/bootcheck"

      - name: Journal of the failed boot (diagnostic boot of the kept overlay)
        if: failure() && steps.boot.outcome == 'failure'
        timeout-minutes: 15
        run: |
          python3 tests/vm/sessioncheck.py --mode journal --disk "$WORK/bootcheck/overlay.qcow2" \
            --out "$WORK/journal-failed-boot" --boot-timeout 600

      - name: Session check (instrumented boot)
        id: session
        timeout-minutes: 25
        run: |
          python3 tests/vm/sessioncheck.py --mode session --disk "$WORK/output/qcow2/disk.qcow2" \
            --plan "$WORK/evidence/plan.json" --out "$WORK/session" --boot-timeout 900

      - name: First-boot check (is the wizard the session, can an account log in)
        id: firstboot
        timeout-minutes: 25
        run: |
          python3 tests/vm/firstbootcheck.py --disk "$WORK/output/qcow2/disk.qcow2" \
            --out "$WORK/firstboot" --boot-timeout 900

      - name: Summary
        if: always()
        run: |
          for f in "$WORK/bootcheck-attempt1/summary.md" "$WORK/bootcheck/summary.md" \
                   "$WORK/session/session.md" \
                   "$WORK/firstboot/firstboot.md" "$WORK/journal-failed-boot/session.md"; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload boot check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ env.WORK }}/evidence
            ${{ env.WORK }}/bootcheck
            ${{ env.WORK }}/bootcheck-attempt1
            ${{ env.WORK }}/session
            ${{ env.WORK }}/firstboot
            ${{ env.WORK }}/journal-failed-boot
            !${{ env.WORK }}/**/*.qcow2
          retention-days: 14
          if-no-files-found: warn

  core-almalinux10:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # The example, not a shipped reference: its platform is shipped, and the
      # example is what exercises it. Its profiles keep AlmaLinux's own look, so
      # the boot check runs without --expect-splash (there is no DeskOS splash).
      WS: example-core-almalinux-10
      ROOT: examples/core-almalinux-10
      IMAGE: localhost/example-core-almalinux-10:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render the build context
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render "$ROOT" --workstation "$WS" --output ctx
          sha256sum ctx/plan.json ctx/generated-manifest.json

      - name: Put container storage and outputs on /mnt
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          sudo chown "$(id -u):$(id -g)" "$WORK"

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Pull the base and the builder, retrying a flaky registry
        run: |
          # quay.io's CDN returned an EOF in the middle of a layer while this was being
          # written (2026-10-18), and losing a build of this length to a pull that had
          # nothing wrong with it is losing the work of the whole job. The retry is
          # explicit and bounded, and the build below runs with --pull=never: what it
          # uses is what arrived, so a failure there is a real one.
          base=$(grep -m1 '^FROM ' ctx/Containerfile | awk '{print $2}')
          for ref in "$base" "$BIB"; do
            ok=0
            for i in 1 2 3 4 5; do
              if sudo podman pull "$ref"; then ok=1; break; fi
              echo "attempt $i failed pulling $ref; retrying in 20s" >&2
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "could not pull $ref after 5 attempts" >&2; exit 1; }
          done

      - name: Build the image
        timeout-minutes: 40
        run: sudo podman build --pull=never -t "$IMAGE" ctx

      - name: Record image evidence
        run: |
          mkdir -p "$WORK/evidence"
          cp ctx/plan.json ctx/generated-manifest.json "$WORK/evidence/"
          grep '^FROM ' ctx/Containerfile > "$WORK/evidence/base.txt"
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}} digest={{.Digest}} created={{.Created}}' | tee "$WORK/evidence/image.txt"
          sudo podman run --rm --network=none "$IMAGE" rpm -qa --qf '%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort > "$WORK/evidence/rpm-qa.txt"
          cat "$WORK/evidence/base.txt"

      - name: Build a QCOW2 without the builder's kernel arguments
        timeout-minutes: 30
        run: |
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=type:unconfined_t \
            -v "$WORK/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type qcow2 --no-default-kernel-args \
            --chown "$(id -u):$(id -g)" "$IMAGE"
          qemu-img check "$WORK/output/qcow2/disk.qcow2"
          sha256sum "$WORK/output/qcow2/disk.qcow2" | tee "$WORK/evidence/qcow2.sha256"

      - name: Boot check (unmodified disk)
        timeout-minutes: 20
        run: |
          # No --expect-splash: the example keeps AlmaLinux's own look. The check
          # classifies pixels, not the splash's identity, so the assertion is the
          # stable graphical screen; AlmaLinux's own splash is not verified here.
          python3 tests/vm/bootcheck.py --disk "$WORK/output/qcow2/disk.qcow2" \
            --out "$WORK/bootcheck" --hash-disk --boot-timeout 420 --shutdown-timeout 120

      - name: Session check (instrumented boot)
        timeout-minutes: 25
        run: |
          python3 tests/vm/sessioncheck.py --mode session --disk "$WORK/output/qcow2/disk.qcow2" \
            --plan "$WORK/evidence/plan.json" --out "$WORK/session" --boot-timeout 900

      - name: First-boot check (is the wizard the session, can an account log in)
        timeout-minutes: 25
        run: |
          python3 tests/vm/firstbootcheck.py --disk "$WORK/output/qcow2/disk.qcow2" \
            --out "$WORK/firstboot" --boot-timeout 900

      - name: Summary
        if: always()
        run: |
          for f in "$WORK/bootcheck/summary.md" "$WORK/session/session.md" \
                   "$WORK/firstboot/firstboot.md"; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload boot check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-evidence-core-almalinux10
          path: |
            ${{ env.WORK }}/evidence
            ${{ env.WORK }}/bootcheck
            ${{ env.WORK }}/session
            ${{ env.WORK }}/firstboot
            !${{ env.WORK }}/**/*.qcow2
          retention-days: 14
          if-no-files-found: warn

  core-ubuntu-2604:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      # The two are independent checks: one failing should not hide the other.
      fail-fast: false
      matrix:
        # The published Core image, and the organization example whose tooling
        # comes from a declared APT source. The second is what proves the source
        # and its key against the vendor's own archive: `apt-get update` fails if
        # the deb822 fields are wrong or the signature is not verified.
        workstation: [example-core-ubuntu-2604, example-ubuntu-vendor]
    env:
      WS: ${{ matrix.workstation }}
      IMAGE: localhost/deskos-core-ubuntu-2604:${{ matrix.workstation }}
      OCI: /mnt/deskos-work/oci
      DISK: /mnt/deskos-work/disk.raw
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render the Ubuntu build context
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render ./examples/core-ubuntu-2604 \
            --workstation "$WS" --output ctx
          sha256sum ctx/plan.json ctx/generated-manifest.json

      - name: Put container storage and outputs on /mnt
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          sudo chown "$(id -u):$(id -g)" "$WORK"

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU, OVMF and skopeo
        run: |
          # skopeo is not on the runner image, and the Ubuntu path needs it to write the
          # compressed OCI layout the install reads.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf skopeo

      - name: Pull the pinned base, retrying a flaky registry
        run: |
          # quay.io's CDN returned an EOF in the middle of a layer while this was being
          # written (2026-10-18), and this base is the largest pull in the fleet. The
          # retry is explicit and bounded, and the build below runs with --pull=never:
          # what it uses is what arrived, so a failure there is a real one.
          base=$(grep -m1 '^FROM ' ctx/Containerfile | awk '{print $2}')
          ok=0
          for i in 1 2 3 4 5; do
            if sudo podman pull "$base"; then ok=1; break; fi
            echo "attempt $i failed pulling $base; retrying in 20s" >&2
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "could not pull $base after 5 attempts" >&2; exit 1; }

      - name: Build the image from the pinned base
        timeout-minutes: 40
        run: |
          # The platform's FROM is the base pinned by digest, and it was pulled with
          # retries in the step above, so this step needs no network for it: --pull=never
          # keeps a failure here a real one. The tag is only for the evidence file.
          grep '^FROM ' ctx/Containerfile
          sudo podman build --pull=never -t "$IMAGE" ctx

      - name: Record image evidence
        run: |
          mkdir -p "$WORK/evidence"
          cp ctx/plan.json ctx/generated-manifest.json "$WORK/evidence/"
          grep '^FROM ' ctx/Containerfile > "$WORK/evidence/base.txt"
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}} digest={{.Digest}} created={{.Created}}' | tee "$WORK/evidence/image.txt"
          sudo podman run --rm --network=none "$IMAGE" dpkg -l > "$WORK/evidence/dpkg-l.txt"
          sudo podman run --rm --network=none "$IMAGE" sh -c 'command -v flatpak || echo "no flatpak"; ls /usr/share/flatpak 2>&1' \
            | tee "$WORK/evidence/flatpak.txt"

      - name: Write the disk from a compressed OCI layout
        timeout-minutes: 30
        run: |
          # Layers must be compressed or the composefs import refuses them, and it is what
          # the install mounts as its source; this is the recipe the base documents.
          sudo skopeo copy containers-storage:"$IMAGE" "oci:$OCI:test"
          truncate -s 32G "$DISK"
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers \
            -v "$OCI:/src-oci:ro" -v "$(dirname "$DISK"):/output" \
            "$IMAGE" bootc install to-disk --via-loopback "/output/$(basename "$DISK")" \
            --source-imgref oci:/src-oci:test \
            --composefs-backend --bootloader systemd --wipe --filesystem ext4 --allow-missing-verity

      - name: Boot check (unmodified raw disk)
        id: boot
        timeout-minutes: 15
        run: |
          # No --expect-splash: the Ubuntu base carries Canonical's boot experience, not
          # DeskOS's, and this disk is the platform's own artifact.
          python3 tests/vm/bootcheck.py --disk "$DISK" \
            --out "$WORK/bootcheck" --hash-disk --boot-timeout 420 --shutdown-timeout 120

      - name: Session check (instrumented boot)
        id: session
        timeout-minutes: 25
        run: |
          # The session check adds a user and an autologin, so on this platform it
          # proves a GNOME session comes up, not the wizard: the first-boot check is
          # what proves the shipped wizard. Ubuntu Core declares no look, favorites
          # or Firefox, so the checks are the session itself and its failed units.
          python3 tests/vm/sessioncheck.py --mode session --disk "$DISK" \
            --plan "$WORK/evidence/plan.json" --out "$WORK/session" --boot-timeout 900

      - name: First-boot check (is the wizard the session, can an account log in)
        id: firstboot
        timeout-minutes: 25
        run: |
          python3 tests/vm/firstbootcheck.py --disk "$DISK" \
            --out "$WORK/firstboot" --boot-timeout 900

      - name: Summary
        if: always()
        run: |
          for f in "$WORK/bootcheck/summary.md" "$WORK/session/session.md" \
                   "$WORK/firstboot/firstboot.md"; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload boot check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vm-evidence-core-ubuntu-2604-${{ matrix.workstation }}
          path: |
            ${{ env.WORK }}/evidence
            ${{ env.WORK }}/bootcheck
            ${{ env.WORK }}/session
            ${{ env.WORK }}/firstboot
            !${{ env.WORK }}/**/*.qcow2
            !${{ env.WORK }}/*.raw
          retention-days: 14
          if-no-files-found: warn
