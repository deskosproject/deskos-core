name: supply-chain (experimental)

# Manual only. The single publish path: builds DeskOS Core for CentOS Stream
# 10 from this checkout, writes the declared SBOM with `deskosctl sbom`,
# produces the installed SBOM with Syft, scans it with Grype, compares the two
# for RPM coverage, then makes a QCOW2 from the same image and runs the boot
# and session checks on it. Only then does it tag, push, sign and attest that
# one digest, and upload the evidence. RHEL scanning runs on the entitled
# factory host, not here. See docs/supply-chain.md and ADR 0010.
on:
  workflow_dispatch:
    inputs:
      fail-on:
        description: Grype severity that fails the job
        type: choice
        options: [negligible, low, medium, high, critical]
        default: critical
      publish:
        description: Push the scanned and boot-checked image to quay.io and sign it (main only)
        type: boolean
        default: false

permissions:
  contents: read
  # Keyless cosign: Fulcio issues a short-lived certificate from the
  # workflow's OIDC identity and Rekor records the signature.
  id-token: write

concurrency:
  group: supply-chain
  cancel-in-progress: false

env:
  IMAGE: localhost/deskos-core-centos10:ci
  # bootc-image-builder pinned to the digest used for local test disks (same
  # as vm-bootcheck.yml).
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  # The OCI archive, the QCOW2 and the test overlays live on the /mnt disk;
  # the root disk is small.
  WORK: /mnt/deskos-work

jobs:
  centos10:
    runs-on: ubuntu-24.04
    # Build (40) + QCOW2 (30) + boot (15) + session (25) can exceed 90.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render the Core build context and write the declared SBOM
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render --workstation deskos-core-centos10 --output ctx
          ./bin/deskosctl sbom --workstation deskos-core-centos10 --output declared.sbom.cdx.json

      - name: The publishable image has no unchecked repository
        # Publication policy (kept out of `deskosctl validate`, which stays a
        # model check): a repository whose GPG check is disabled cannot back a
        # published image.
        run: jq -e 'all(.artifact.rpmRepositories[]; .gpgCheck)' ctx/plan.json > /dev/null

      - name: Put container storage and the large artifacts on /mnt
        # The root disk is small; the same layout as vm-bootcheck.yml.
        run: |
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          sudo chown "$(id -u):$(id -g)" "$WORK"

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Build the image
        timeout-minutes: 40
        run: sudo podman build --pull=missing -t "$IMAGE" ctx

      - name: Export the image to an OCI archive
        run: |
          sudo podman save --format oci-archive -o "$WORK/image.tar" "$IMAGE"
          sudo chown "$(id -u):$(id -g)" "$WORK/image.tar"
          ls -lh "$WORK/image.tar"

      - name: Install Syft and Grype (pinned)
        env:
          # The release tag, and the commit install.sh is fetched at: a moved
          # tag cannot change the installer, and the installer verifies the
          # release checksums of the binaries it downloads.
          SYFT_VERSION: v1.54.1
          SYFT_INSTALL: b254e6d92f28c3868a755f62fb3ca8f26e9fee76
          GRYPE_VERSION: v0.120.1
          GRYPE_INSTALL: 6f8d854af29d3a3086b11a84afa51554a2a245fe
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/$SYFT_INSTALL/install.sh" | sh -s -- -b "$HOME/.local/bin" "$SYFT_VERSION"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/$GRYPE_INSTALL/install.sh" | sh -s -- -b "$HOME/.local/bin" "$GRYPE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Installed SBOM (Syft)
        run: syft "oci-archive:$WORK/image.tar" -o cyclonedx-json=installed.sbom.cdx.json

      - name: CVE scan (Grype)
        run: |
          # Evidence passes: pinned to the raw configuration, so grype.txt and
          # cves.json stay unfiltered even when Grype finds another
          # configuration on the runner.
          grype "oci-archive:$WORK/image.tar" \
            --config tests/supply-chain/grype-raw.yaml -o table | tee grype.txt
          grype "oci-archive:$WORK/image.tar" \
            --config tests/supply-chain/grype-raw.yaml -o json > cves.json
          # The reviewed exceptions record is verified against the raw report
          # and the gate configuration is generated from it, so the gate can
          # never accept more than the record approves: a new component, a new
          # version, a moved base layer or an expired review fails here first.
          # See docs/supply-chain.md and ADR 0012.
          out=$(python3 tests/supply-chain/check_exceptions.py \
            --cves cves.json \
            --exceptions tests/supply-chain/exceptions.json \
            --plan ctx/plan.json \
            --effective "$WORK/effective-exceptions.json")
          echo "$out"
          { echo "### Accepted vulnerability exceptions"; echo; echo "$out"; } >> "$GITHUB_STEP_SUMMARY"
          python3 tests/supply-chain/check_exceptions.py \
            --exceptions tests/supply-chain/exceptions.json \
            --emit-gate "$WORK/gate.grype.yaml"
          # The gate applies the severity policy: the generated configuration
          # and the OpenVEX statements (ADR 0012).
          grype "oci-archive:$WORK/image.tar" \
            --config "$WORK/gate.grype.yaml" \
            --vex tests/supply-chain/vex.openvex.json \
            --fail-on "${{ inputs.fail-on }}" -o table > /dev/null

      - name: Compare declared and installed SBOMs
        run: python3 tests/supply-chain/compare.py declared.sbom.cdx.json installed.sbom.cdx.json

      - name: Build a QCOW2 without the builder's kernel arguments
        timeout-minutes: 30
        run: |
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v "$WORK/output:/output" -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type qcow2 --no-default-kernel-args \
            --chown "$(id -u):$(id -g)" "$IMAGE"
          qemu-img check "$WORK/output/qcow2/disk.qcow2"

      - name: Boot check (unmodified disk)
        id: boot
        timeout-minutes: 15
        run: |
          python3 tests/vm/bootcheck.py --disk "$WORK/output/qcow2/disk.qcow2" \
            --out "$WORK/bootcheck" --expect-splash --hash-disk --keep-overlay --boot-timeout 420

      - name: Journal of the failed boot (diagnostic boot of the kept overlay)
        if: failure() && steps.boot.outcome == 'failure'
        timeout-minutes: 15
        run: |
          python3 tests/vm/sessioncheck.py --mode journal --disk "$WORK/bootcheck/overlay.qcow2" \
            --out "$WORK/journal-failed-boot" --boot-timeout 600

      - name: Session check (instrumented boot)
        timeout-minutes: 25
        run: |
          python3 tests/vm/sessioncheck.py --mode session --disk "$WORK/output/qcow2/disk.qcow2" \
            --plan ctx/plan.json --out "$WORK/session" --boot-timeout 900
          # Record the image that passed; the same image is tagged, pushed and
          # signed below, so the published digest is the tested one.
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}}' | tee "$WORK/image.txt"

      - name: Install cosign
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The action defaults to an older cosign; pin the release we verify.
          cosign-release: 'v3.1.3'

      - name: Publish, sign and attest the scanned image
        # CentOS Stream 10 only; RHEL images are never published. The
        # signature is keyless: it is bound to this workflow's OIDC
        # identity, and a signed attestation references the installed SBOM.
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          DEST: quay.io/deskos/deskos-core
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          printf '%s' "$QUAY_ROBOT_TOKEN" | sudo podman login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          # Push the immutable commit tag by digest, sign and verify it, and
          # only then move :latest to it: a failed signature must never leave
          # :latest pointing at an unsigned image.
          sudo podman tag "$IMAGE" "$DEST:$GITHUB_SHA"
          sudo podman push --digestfile digest.txt "$DEST:$GITHUB_SHA"
          digest="$(tr -d '\n\r' < digest.txt)"
          ref="$DEST@$digest"
          printf '%s' "$QUAY_ROBOT_TOKEN" | cosign login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          # Rekor is reached over the network; retry the signing steps rather
          # than fail an image that already passed scan, boot and session.
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              [ "$n" -ge 5 ] && { echo "gave up after $n attempts: $*" >&2; return 1; }
              echo "attempt $n failed; retrying in $((n*15))s: $*" >&2
              sleep $((n*15))
            done
          }
          retry cosign sign --yes "$ref"
          # Rekor's public instance caps an attestation at 100 KB and an SBOM
          # is far larger, so the signed statement names the image digest and
          # the SBOM's exact SHA-256; the SBOM itself travels as workflow
          # evidence (durable storage is tracked).
          sha="$(sha256sum installed.sbom.cdx.json | cut -d' ' -f1)"
          jq -n --arg sha "$sha" --arg img "$digest" --slurpfile s installed.sbom.cdx.json \
            '{image:$img, name:"installed.sbom.cdx.json", format:$s[0].bomFormat, specVersion:$s[0].specVersion, sha256:$sha, components:($s[0].components|length), location:"supply-chain-evidence workflow artifact"}' \
            > sbom-reference.json
          retry cosign attest --yes --type "https://deskos.org/supply-chain/sbom/v1" \
            --predicate sbom-reference.json "$ref"
          # The accepted-risk decision is part of the signed record, not only
          # of a 14-day Actions artifact: attest the standing approval and,
          # separately, the exact matches this image accepted.
          retry cosign attest --yes --type "https://deskos.org/supply-chain/exceptions/v1" \
            --predicate tests/supply-chain/exceptions.json "$ref"
          retry cosign attest --yes --type "https://deskos.org/supply-chain/effective-exceptions/v1" \
            --predicate "$WORK/effective-exceptions.json" "$ref"
          cosign verify "$ref" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/deskosproject/deskos-core/' | tee cosign-verify.txt
          cosign verify-attestation \
            --type "https://deskos.org/supply-chain/sbom/v1" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/deskosproject/deskos-core/' "$ref" \
            | tee -a cosign-verify.txt
          cosign verify-attestation \
            --type "https://deskos.org/supply-chain/exceptions/v1" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/deskosproject/deskos-core/' "$ref" \
            | tee -a cosign-verify.txt
          cosign verify-attestation \
            --type "https://deskos.org/supply-chain/effective-exceptions/v1" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/deskosproject/deskos-core/' "$ref" \
            | tee -a cosign-verify.txt
          # :latest moves only after the digest is signed and verified.
          sudo podman tag "$IMAGE" "$DEST:latest"
          sudo podman push "$DEST:latest"
          # cosign v3 has no `logout`; the credentials live in the runner's
          # docker config, and podman logout clears the registry login.
          sudo podman logout quay.io
          echo "Published, signed and attested $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-evidence
          path: |
            declared.sbom.cdx.json
            installed.sbom.cdx.json
            cves.json
            grype.txt
            digest.txt
            cosign-verify.txt
            tests/supply-chain/exceptions.json
            sbom-reference.json
            ctx/plan.json
            ctx/generated-manifest.json
            ${{ env.WORK }}/gate.grype.yaml
            ${{ env.WORK }}/effective-exceptions.json
            ${{ env.WORK }}/image.txt
            ${{ env.WORK }}/bootcheck/summary.md
            ${{ env.WORK }}/session/session.md
          retention-days: 14
          if-no-files-found: warn
