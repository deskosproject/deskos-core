name: supply-chain

# The single publish path: builds the DeskOS Core reference workstation for each
# platform in the matrix from this checkout, writes the
# declared SBOM with `deskosctl sbom`, produces the installed SBOM with Syft,
# scans it with Grype, compares the two for RPM coverage, then makes a QCOW2
# from the same image and runs the boot and session checks on it. Only then does
# it tag, push, sign and attest that one digest, and upload the evidence. RHEL is
# not built, scanned or published here at all: its build, scan and boot run in the
# downstream organization's repository. The weekly schedule publishes; a dispatch
# publishes only with `publish=true` on `main`. See docs/supply-chain.md and
# ADR 0010.
on:
  # The weekly run builds, scans, boots, publishes and signs. It used to be a
  # watch that could not publish, which made "the newest image" depend on someone
  # remembering to dispatch; that is not a cadence. A dispatch with publish=false
  # still runs the gate without publishing, for a dry look at a base bump.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      fail-on:
        description: Grype severity that fails the job
        type: choice
        options: [negligible, low, medium, high, critical]
        default: critical
      publish:
        description: Push the scanned and boot-checked image to quay.io and sign it (main only)
        type: boolean
        default: false

permissions:
  contents: read
  # Keyless cosign: Fulcio issues a short-lived certificate from the
  # workflow's OIDC identity and Rekor records the signature.
  id-token: write

concurrency:
  group: supply-chain
  cancel-in-progress: false

env:
  # bootc-image-builder pinned to the digest used for local test disks (same
  # as vm-bootcheck.yml).
  # Pinned to a specific build, not to :latest. The image :latest serves today
  # (e8df8c53) no longer accepts --no-default-kernel-args, which is what makes the
  # disk boot with the image's own kernel arguments instead of the builder's serial
  # console, and it reports no build revision. Moving this pin means finding out
  # what replaces that flag first.
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  # The OCI archive, the QCOW2 and the test overlays live on the /mnt disk;
  # the root disk is small.
  WORK: /mnt/deskos-work

jobs:
  publish:
    # One switch stops publication: set the repository variable PUBLISH_FREEZE
    # (with a sentence saying why) and the gate does not publish, the installer
    # does not run and there is nothing to promote. Freezing used to mean editing
    # four workflows during an incident (tabletop, 2026-10-28).
    if: vars.PUBLISH_FREEZE == ''
    runs-on: ubuntu-24.04
    outputs:
      # The ISO workflow builds from the digest this job published.
      digest: ${{ steps.publish_image.outputs.digest }}
    # Build (40) + QCOW2 (30) + boot (15) + session (25) can exceed 90.
    timeout-minutes: 150
    strategy:
      # One platform failing must not hide another.
      fail-fast: false
      matrix:
        # One repository per platform, so :latest never changes distro or
        # release. RHEL is never published. AlmaLinux is an example and has no
        # publication leg.
        #
        # Adding a leg with `disk: bib` here needs a matching `iso:` call at the
        # bottom of this file, which is where its installer is built.
        #
        # `disk` says how that platform's disk is written and `diskfile` where it
        # lands, because they differ: the EL platforms go through
        # bootc-image-builder, and Ubuntu has no Anaconda path, so it writes with
        # `bootc install to-disk`. `splash` says whether a DeskOS splash is
        # expected. Declared per leg on purpose: a gate that assumes one
        # platform's disk is not a gate, and a new platform must not be able to
        # silently inherit another's disk path and skip its own boot check.
        include:
          - token: centos-stream-10
            workstation: deskos-core-centos-stream-10
            exceptions: tests/supply-chain/exceptions.json
            disk: bib
            diskfile: output/qcow2/disk.qcow2
            rootfs: xfs
            config: tests/vm/config.toml
            splash: true
          # Fedora's disk is btrfs, the filesystem its base is built for: bootc
          # cannot infer a default for Silverblue and bib stops with "missing
          # required info: DefaultRootFs" without --rootfs. The exceptions record
          # is per platform because it names the base the risk was reviewed
          # against (docs/supply-chain.md, ADR 0012).
          - token: fedora-45
            workstation: deskos-core-fedora-45
            exceptions: tests/supply-chain/exceptions-fedora-45.json
            disk: bib
            diskfile: output/qcow2/disk.qcow2
            rootfs: btrfs
            config: tests/vm/config-btrfs.toml
            splash: true
    env:
      IMAGE: localhost/${{ matrix.workstation }}:ci
      # Declared once, at the job level, so the assertion step and the boot check
      # read the same value: a boolean comparison, because comparing the matrix's
      # boolean to the string 'true' is never true and would silently drop the
      # splash expectation from every leg.
      SPLASH: ${{ matrix.splash && '--expect-splash' || '' }}
      # A scheduled run has no workflow_dispatch inputs. Without a fallback,
      # `inputs.fail-on` is empty and Grype can run with no severity threshold;
      # the weekly run would then silently weaken the Critical baseline.
      FAIL_ON: ${{ inputs.fail-on || 'critical' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Render the Core build context and write the declared SBOM
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render --workstation ${{ matrix.workstation }} --output ctx
          ./bin/deskosctl sbom --workstation ${{ matrix.workstation }} --output declared.sbom.cdx.json

      - name: Refuse to publish an image with an unchecked repository
        # Publication policy (kept out of `deskosctl validate`, which stays a
        # model check): a repository whose GPG check is disabled cannot back a
        # published image.
        run: jq -e 'all(.artifact.rpmRepositories[]; .gpgCheck)' ctx/plan.json > /dev/null

      - name: Free the runner's unused toolchains
        # The hosted image carries a .NET SDK, an Android SDK, GHC and the whole
        # hostedtoolcache that nothing here uses. Removing them before the build
        # is the practice Fatherlinux documents for image-mode CI on hosted
        # runners (crunchtools.com/ci-cd-for-image-mode-rhel), and it leaves the
        # disk and the page cache to the image instead of to toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          df -h / /mnt

      - name: Put container storage and the large artifacts on /mnt
        # The root disk is small; the same layout as vm-bootcheck.yml.
        run: |
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          sudo chown "$(id -u):$(id -g)" "$WORK"
          # The runner image ships a default CNI conflist while the CNI plugin binaries
          # are not installed, and this podman uses netavark: nothing here creates a CNI
          # network, and podman warns on every run that it cannot validate a file it does
          # not read. Removing it keeps a warning in these logs worth reading.
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU, OVMF and skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf skopeo

      - name: Pull the base and the builder, with retries
        run: |
          # The publish gate is the longest job in the fleet (150 minutes), and quay.io's
          # CDN returned an EOF in the middle of a layer while this was being written
          # (2026-10-18). The retry is explicit and bounded, and the build and the writer
          # below run with --pull=never: what they use is what arrived, so a failure there
          # is a real one.
          base=$(grep -m1 '^FROM ' ctx/Containerfile | awk '{print $2}')
          for ref in "$base" "$BIB"; do
            ok=0
            for i in 1 2 3 4 5; do
              if sudo podman pull "$ref"; then ok=1; break; fi
              echo "attempt $i failed pulling $ref; retrying in 20s" >&2
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "could not pull $ref after 5 attempts" >&2; exit 1; }
          done

      - name: Build the image
        timeout-minutes: 40
        run: sudo podman build --pull=never -t "$IMAGE" ctx

      - name: Record the tested image identity
        run: |
          mkdir -p "$WORK/evidence"
          sudo podman image inspect "$IMAGE" \
            --format 'id={{.Id}} digest={{.Digest}} created={{.Created}}' \
            | tee "$WORK/evidence/image-built.txt"

      - name: Export the image to an OCI archive
        run: |
          sudo podman save --format oci-archive -o "$WORK/image.tar" "$IMAGE"
          sudo chown "$(id -u):$(id -g)" "$WORK/image.tar"
          sha256sum "$WORK/image.tar" | tee "$WORK/evidence/image.tar.sha256"
          ls -lh "$WORK/image.tar"

      - name: Install Syft and Grype (pinned)
        env:
          # The release tag, and the commit install.sh is fetched at: a moved
          # tag cannot change the installer, and the installer verifies the
          # release checksums of the binaries it downloads.
          SYFT_VERSION: v1.55.0
          SYFT_INSTALL: b254e6d92f28c3868a755f62fb3ca8f26e9fee76
          GRYPE_VERSION: v0.120.1
          GRYPE_INSTALL: 6f8d854af29d3a3086b11a84afa51554a2a245fe
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/$SYFT_INSTALL/install.sh" | sh -s -- -b "$HOME/.local/bin" "$SYFT_VERSION"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/$GRYPE_INSTALL/install.sh" | sh -s -- -b "$HOME/.local/bin" "$GRYPE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Installed SBOM (Syft)
        env:
          # The scanner unpacks the archive's layers under TMPDIR, and the image
          # is 8 GB uncompressed. The runner's root disk is 14 GB, so the default
          # /tmp fills and the runner dies mid-scan: measured three times on the
          # Fedora leg (2026-10-30), which was the only leg with an archive big
          # enough to cross it. /mnt is the disk this job already uses for the
          # image and the disk images.
          TMPDIR: ${{ env.WORK }}/tmp
          # The Fedora image is twice the CentOS Stream one and the scanner's
          # default is one worker per core; two keeps the peak inside the
          # runner's memory. GOMEMLIMIT is the Go runtime's soft limit, so the
          # collector works harder instead of the kernel killing the job.
          SYFT_PARALLELISM: '2'
          GOMEMLIMIT: '6GiB'
        run: |
          mkdir -p "$TMPDIR"
          free -h
          df -h / /mnt
          syft "oci-archive:$WORK/image.tar" -o cyclonedx-json=installed.sbom.cdx.json

      - name: CVE scan (Grype)
        env:
          # Same reason as the SBOM: Grype reads the same archive.
          TMPDIR: ${{ env.WORK }}/tmp
          GRYPE_PARALLELISM: '2'
          GOMEMLIMIT: '6GiB'
        run: |
          mkdir -p "$TMPDIR"
          free -h
          # Evidence passes: pinned to the raw configuration, so grype.txt and
          # cves.json stay unfiltered even when Grype finds another
          # configuration on the runner.
          grype "oci-archive:$WORK/image.tar" \
            --config tests/supply-chain/grype-raw.yaml -o table | tee grype.txt
          grype "oci-archive:$WORK/image.tar" \
            --config tests/supply-chain/grype-raw.yaml -o json > cves.json
          # The reviewed exceptions record is verified against the raw report
          # and the gate configuration is generated from it, so the gate can
          # never accept more than the record approves: a new component, a new
          # version, a moved base layer or an expired review fails here first.
          # See docs/supply-chain.md and ADR 0012.
          out=$(python3 tests/supply-chain/check_exceptions.py \
            --cves cves.json \
            --exceptions ${{ matrix.exceptions }} \
            --plan ctx/plan.json \
            --effective "$WORK/effective-exceptions.json")
          echo "$out"
          { echo "### Accepted vulnerability exceptions"; echo; echo "$out"; } >> "$GITHUB_STEP_SUMMARY"
          python3 tests/supply-chain/check_exceptions.py \
            --exceptions ${{ matrix.exceptions }} \
            --emit-gate "$WORK/gate.grype.yaml"
          # The gate applies the severity policy: the generated configuration
          # and the OpenVEX statements (ADR 0012).
          grype "oci-archive:$WORK/image.tar" \
            --config "$WORK/gate.grype.yaml" \
            --vex tests/supply-chain/vex.openvex.json \
            --fail-on "$FAIL_ON" -o table > /dev/null

      - name: Compare declared and installed SBOMs
        run: python3 tests/supply-chain/compare.py declared.sbom.cdx.json installed.sbom.cdx.json

      - name: Build a QCOW2 without the builder's kernel arguments (bib)
        if: matrix.disk == 'bib'
        timeout-minutes: 30
        run: |
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=type:unconfined_t \
            -v "$WORK/output:/output" -v "$PWD/${{ matrix.config }}:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type qcow2 --rootfs "${{ matrix.rootfs }}" \
            --config /config.toml --no-default-kernel-args \
            --chown "$(id -u):$(id -g)" "$IMAGE"
          qemu-img check "$WORK/output/qcow2/disk.qcow2"

      - name: Write the disk with bootc install to-disk (bootc-install)
        if: matrix.disk == 'bootc-install'
        timeout-minutes: 30
        run: |
          # Ubuntu's image has no Anaconda path, and the composefs import refuses
          # uncompressed layers: the disk is written from a compressed OCI layout,
          # the same recipe the base documents and the VM check uses.
          sudo skopeo copy "containers-storage:$IMAGE" "oci:$WORK/oci:test"
          truncate -s 32G "$WORK/${{ matrix.diskfile }}"
          sudo podman run --rm --privileged --pid=host \
            --security-opt label=type:unconfined_t \
            -v /dev:/dev -v /var/lib/containers:/var/lib/containers \
            -v "$WORK/oci:/src-oci:ro" -v "$WORK:/output" \
            "$IMAGE" bootc install to-disk --via-loopback "/output/${{ matrix.diskfile }}" \
            --source-imgref oci:/src-oci:test \
            --composefs-backend --bootloader systemd --wipe --filesystem ext4 --allow-missing-verity

      - name: Record the tested disk identity
        run: |
          test -f "$WORK/${{ matrix.diskfile }}"
          sha256sum "$WORK/${{ matrix.diskfile }}" | tee "$WORK/evidence/disk.sha256"

      - name: Assert the leg's declared disk and splash facts
        run: |
          # The bug this guards against, which this PR had: `splash` is a boolean
          # in the matrix, and comparing it to the string 'true' is never true, so
          # the flag silently disappeared and every leg ran a weaker check. Assert
          # the flag exists exactly when the leg declares it.
          case "${{ matrix.splash }}" in
            true)  [ -n "$SPLASH" ] || { echo "::error::splash is true but no flag was produced"; exit 1; } ;;
            false) [ -z "$SPLASH" ] || { echo "::error::splash is false but a flag was produced"; exit 1; } ;;
            *)     echo "::error::every leg must declare splash as true or false, got '${{ matrix.splash }}'"; exit 1 ;;
          esac
          echo "disk=${{ matrix.disk }} diskfile=${{ matrix.diskfile }} splash=${{ matrix.splash }} flag='${SPLASH}'"

      - name: Boot check (unmodified disk)
        id: boot
        timeout-minutes: 15
        run: |
          splash=()
          [ -n "$SPLASH" ] && splash=("$SPLASH")
          python3 tests/vm/bootcheck.py --disk "$WORK/${{ matrix.diskfile }}" \
            --out "$WORK/bootcheck" "${splash[@]}" --hash-disk --keep-overlay --boot-timeout 420

      - name: Journal of the failed boot (diagnostic boot of the kept overlay)
        if: failure() && steps.boot.outcome == 'failure'
        timeout-minutes: 15
        run: |
          python3 tests/vm/sessioncheck.py --mode journal --disk "$WORK/bootcheck/overlay.qcow2" \
            --out "$WORK/journal-failed-boot" --boot-timeout 600

      - name: Session check (instrumented boot)
        timeout-minutes: 25
        run: |
          python3 tests/vm/sessioncheck.py --mode session --disk "$WORK/${{ matrix.diskfile }}" \
            --plan ctx/plan.json --out "$WORK/session" --boot-timeout 900
          # Record the image that passed; the same image is tagged, pushed and
          # signed below, so the published digest is the tested one.
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}}' | tee "$WORK/image.txt"

      - name: First-boot check (is the wizard the session, can an account log in)
        timeout-minutes: 25
        run: |
          python3 tests/vm/firstbootcheck.py --disk "$WORK/${{ matrix.diskfile }}" \
            --out "$WORK/firstboot" --boot-timeout 900

      - name: Install cosign
        if: (github.event_name == 'schedule' || inputs.publish) && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The action defaults to an older cosign; pin the release we verify.
          cosign-release: 'v3.1.3'

      - name: Publish, sign and attest the scanned image
        id: publish_image
        # One image per platform; RHEL images are never published. The
        # signature is keyless: it is bound to this workflow's OIDC
        # identity, and a signed attestation references the installed SBOM.
        if: (github.event_name == 'schedule' || inputs.publish) && github.ref == 'refs/heads/main'
        env:
          DEST: quay.io/deskos/deskos-core-${{ matrix.token }}
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          printf '%s' "$QUAY_ROBOT_TOKEN" | sudo podman login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          # Publish the manifest that was booted, and only that one. The EL legs
          # have their disk built by bootc-image-builder **from the storage
          # image**, so the storage image is what was tested; Ubuntu's disk is
          # written from the recompressed OCI layout, so that layout is. Copying it
          # with --preserve-digests publishes those exact bytes, instead of
          # producing a second representation of the image that nothing booted.
          if [ "${{ matrix.disk }}" = "bootc-install" ]; then
            tested="$(sudo skopeo inspect --format '{{.Digest}}' "oci:$WORK/oci:test")"
            sudo skopeo copy --preserve-digests "oci:$WORK/oci:test" "docker://$DEST:$GITHUB_SHA"
            published="$(sudo skopeo inspect --format '{{.Digest}}' "docker://$DEST:$GITHUB_SHA")"
            [ "$published" = "$tested" ] || { echo "::error::published $published, tested $tested"; exit 1; }
            printf '%s\n' "$published" > digest.txt
          else
            sudo podman tag "$IMAGE" "$DEST:$GITHUB_SHA"
            sudo podman push --digestfile digest.txt "$DEST:$GITHUB_SHA"
          fi
          digest="$(tr -d '\n\r' < digest.txt)"
          ref="$DEST@$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf '%s' "$QUAY_ROBOT_TOKEN" | cosign login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          # Rekor is reached over the network; retry the signing steps rather
          # than fail an image that already passed scan, boot and session.
          retry() {
            local n=0
            until "$@"; do
              n=$((n+1))
              [ "$n" -ge 5 ] && { echo "gave up after $n attempts: $*" >&2; return 1; }
              echo "attempt $n failed; retrying in $((n*15))s: $*" >&2
              sleep $((n*15))
            done
          }
          retry cosign sign --yes "$ref"
          # Rekor's public instance caps an attestation at 100 KB and an SBOM
          # is far larger, so the signed statement names the image digest and
          # the SBOM's exact SHA-256; the SBOM itself travels as workflow
          # evidence (durable storage is tracked).
          sha="$(sha256sum installed.sbom.cdx.json | cut -d' ' -f1)"
          jq -n --arg sha "$sha" --arg img "$digest" --slurpfile s installed.sbom.cdx.json \
            '{image:$img, name:"installed.sbom.cdx.json", format:$s[0].bomFormat, specVersion:$s[0].specVersion, sha256:$sha, components:($s[0].components|length), location:"supply-chain-evidence workflow artifact"}' \
            > sbom-reference.json
          retry cosign attest --yes --type "https://deskos.org/supply-chain/sbom/v1" \
            --predicate sbom-reference.json "$ref"
          # The accepted-risk decision is part of the signed record, not only
          # of a 14-day Actions artifact: attest the standing approval and,
          # separately, the exact matches this image accepted.
          retry cosign attest --yes --type "https://deskos.org/supply-chain/exceptions/v1" \
            --predicate ${{ matrix.exceptions }} "$ref"
          retry cosign attest --yes --type "https://deskos.org/supply-chain/effective-exceptions/v1" \
            --predicate "$WORK/effective-exceptions.json" "$ref"
          # SLSA v1 provenance: the commit, the base image digest the plan pins,
          # and this workflow as the builder. Produced by the pipeline that builds
          # the image, which is the honest claim (SLSA Build L2 shape); it is not
          # an isolated L3 builder and does not pretend to be.
          #
          # This file is the **predicate**, not a statement: cosign builds the
          # statement around it and sets the subject from the image digest. Given
          # a whole statement it keeps only the fields it recognises, drops the
          # rest, and attests an empty predicate *without failing* — verified
          # against cosign v3.1.3. Hence the check below.
          base="$(jq -r '.artifact.baseImage.digest' ctx/plan.json)"
          test -n "$base" -a "$base" != null
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg base "$base" \
            --arg run "$GITHUB_RUN_ID" \
            --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --arg platform "${{ matrix.token }}" \
            '{
              buildDefinition: {
                buildType: "https://deskos.org/build/supply-chain/v1",
                externalParameters: {platform: $platform, baseImage: $base},
                internalParameters: {workflow: "supply-chain.yml"},
                resolvedDependencies: [
                  {uri: $repo, digest: {gitCommit: $commit}},
                  {uri: "base-image", digest: {sha256: ($base | sub("^sha256:"; ""))}}
                ]
              },
              runDetails: {
                builder: {id: ($repo + "/.github/workflows/supply-chain.yml@refs/heads/main")},
                metadata: {invocationId: $run}
              }
            }' > provenance.json
          # What is attested is what this run says: commit, base, builder, run.
          jq -e --arg commit "$GITHUB_SHA" --arg base "$base" --arg run "$GITHUB_RUN_ID" '
            (.buildDefinition.buildType == "https://deskos.org/build/supply-chain/v1")
            and (.runDetails.metadata.invocationId == $run)
            and (.runDetails.builder.id | endswith("/.github/workflows/supply-chain.yml@refs/heads/main"))
            and any(.buildDefinition.resolvedDependencies[]; .digest.gitCommit == $commit)
            and any(.buildDefinition.resolvedDependencies[];
                    .digest.sha256 == ($base | sub("^sha256:"; "")))
          ' provenance.json > /dev/null
          retry cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$ref"
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main' "$ref" \
            | tee -a cosign-verify.txt
          # Pin the release workflow, not the repository: another workflow in
          # this repository must not be able to sign a published image.
          cosign verify "$ref" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main' | tee cosign-verify.txt
          cosign verify-attestation \
            --type "https://deskos.org/supply-chain/sbom/v1" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main' "$ref" \
            | tee -a cosign-verify.txt
          cosign verify-attestation \
            --type "https://deskos.org/supply-chain/exceptions/v1" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main' "$ref" \
            | tee -a cosign-verify.txt
          cosign verify-attestation \
            --type "https://deskos.org/supply-chain/effective-exceptions/v1" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity 'https://github.com/deskosproject/deskos-core/.github/workflows/supply-chain.yml@refs/heads/main' "$ref" \
            | tee -a cosign-verify.txt
          # :latest moves only after the digest is signed and verified, and it
          # moves **by digest**: skopeo copies the manifest the signature is
          # about and preserves its digest, so the tag cannot end up on bytes
          # the signature does not cover — unlike a second push from local
          # storage, where a mismatch is only discovered after the tag moved.
          # (containers/image's default policy accepts the source; the check on
          # this path is cosign, not a registry signature.)
          sudo skopeo copy --preserve-digests "docker://$DEST@$digest" "docker://$DEST:latest"
          latest="$(sudo skopeo inspect --format '{{.Digest}}' "docker://$DEST:latest")"
          printf '%s\n' "$latest" > latest-digest.txt
          [ "$latest" = "$digest" ] || { echo "::error::$DEST:latest is $latest, not the signed $digest"; exit 1; }
          # The gate's own channel. :latest stays for machines and documents that
          # already follow it; :stable is never moved here, only by a recorded
          # promotion (promotion.yml), so "what the gate built" and "what a person
          # promoted" are different tags.
          sudo skopeo copy --preserve-digests "docker://$DEST@$digest" "docker://$DEST:candidate"
          candidate="$(sudo skopeo inspect --format '{{.Digest}}' "docker://$DEST:candidate")"
          [ "$candidate" = "$digest" ] || { echo "::error::$DEST:candidate is $candidate, not the signed $digest"; exit 1; }
          # cosign v3 has no `logout`; the credentials live in the runner's
          # docker config, and podman logout clears the registry login.
          sudo podman logout quay.io
          echo "Published, signed and attested $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: The acceptance record against what this scan accepted
        # The acceptance records name Criticals that belong to the vendor's base,
        # and the vendors fix them by rebuilding. Nothing tells us when that
        # happens: the pin check only confirms a digest still exists, and a golden
        # only records the render. This is the watch.
        #
        # It reads what the gate just wrote, so it runs only on a leg whose gate
        # passed, and it steps aside if that file is not there rather than adding a
        # second failure on top of the real one.
        if: success()
        run: |
          eff="$WORK/effective-exceptions.json"
          if [ ! -f "$eff" ]; then
            echo "no effective-exceptions.json for this leg; nothing to compare" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${{ matrix.exceptions }}" ]; then
            echo "this platform accepts nothing; nothing to compare" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          EFF="$eff" EXCEPTIONS_FILE="${{ matrix.exceptions }}" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          rec = json.load(open(os.environ["EXCEPTIONS_FILE"]))
          eff = json.load(open(os.environ["EFF"]))
          # The id lives on the exception; each of its matches carries the rest.
          declared = {(e["id"], m["package"], m["type"], m.get("version", ""), m.get("path", ""))
                      for e in rec.get("exceptions") or [] for m in e["matches"]}
          used = {(e["id"], e["package"], e["type"], e.get("version", ""), e.get("path", ""))
                  for e in eff.get("exceptions") or []}
          droppable = declared - used
          print("## Accepted risk on this platform\n")
          print(f"- declared in the record: {len(declared)}")
          print(f"- still reported by the scan: {len(used)}")
          print(f"- **no longer reported, so the record can drop them: {len(droppable)}**")
          for row in sorted(droppable):
              print(f"  - {row[0]} {row[1]} {row[2]} {row[3]} {row[4]}")
          PY

      - name: Write the artifact identity record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$WORK/evidence"
          args=(
            --output "$WORK/evidence/identity.json"
            --allow-missing
            --set commit="$GITHUB_SHA"
            --set run_id="$GITHUB_RUN_ID"
            --set run_attempt="$GITHUB_RUN_ATTEMPT"
            --set workflow="$GITHUB_WORKFLOW"
            --set job="$GITHUB_JOB"
            --set platform="${{ matrix.token }}"
            --set workstation="${{ matrix.workstation }}"
            --set image_id="$(sudo podman image inspect "$IMAGE" --format '{{.Id}}' 2>/dev/null || true)"
            --set image_digest="$(sudo podman image inspect "$IMAGE" --format '{{.Digest}}' 2>/dev/null || true)"
            --file plan=ctx/plan.json
            --file generated_manifest=ctx/generated-manifest.json
            --file declared_sbom=declared.sbom.cdx.json
            --file installed_sbom=installed.sbom.cdx.json
            --file image_archive="$WORK/image.tar"
            --file disk="$WORK/${{ matrix.diskfile }}"
            --require commit
            --require run_id
            --require platform
            --require workstation
            --require image_id
            --require plan
            --require generated_manifest
            --require declared_sbom
            --require installed_sbom
            --require image_archive
            --require disk
          )
          if [ -s digest.txt ]; then
            args+=(--set published_digest="$(tr -d '\n\r' < digest.txt)")
            args+=(--set published_ref="quay.io/deskos/deskos-core-${{ matrix.token }}@$(tr -d '\n\r' < digest.txt)")
          fi
          for pair in \
            "cosign_verify=cosign-verify.txt" \
            "bootcheck=$WORK/bootcheck/summary.json" \
            "session=$WORK/session/session.json" \
            "firstboot=$WORK/firstboot/firstboot.json"; do
            file="${pair#*=}"
            if [ -f "$file" ]; then args+=(--file "$pair"); fi
          done
          python3 tests/supply-chain/identity.py "${args[@]}"

      - name: Assert the identity record is complete
        if: success()
        run: python3 tests/supply-chain/identity.py --check "$WORK/evidence/identity.json"

      - name: Stage durable evidence
        if: (github.event_name == 'schedule' || inputs.publish) && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          d="$WORK/durable"
          rm -rf "$d"
          mkdir -p "$d"
          cp declared.sbom.cdx.json installed.sbom.cdx.json cves.json grype.txt \
            cosign-verify.txt digest.txt "$d/"
          cp ctx/plan.json "$d/plan.json"
          cp ctx/generated-manifest.json "$d/generated-manifest.json"
          cp "$WORK/evidence/identity.json" "$d/identity.json"
          cp "$WORK/image.txt" "$d/image.txt"
          cp "$WORK/gate.grype.yaml" "$d/gate.grype.yaml"
          cp "$WORK/effective-exceptions.json" "$d/effective-exceptions.json"
          cp "$WORK/bootcheck/summary.json" "$d/bootcheck.summary.json"
          cp "$WORK/session/session.json" "$d/session.json"
          cp "$WORK/firstboot/firstboot.json" "$d/firstboot.json"
          printf '%s\n' "$GITHUB_SHA" > "$d/commit.txt"

      - name: Upload durable evidence
        if: (github.event_name == 'schedule' || inputs.publish) && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supply-chain-durable-${{ matrix.token }}-attempt-${{ github.run_attempt }}
          path: ${{ env.WORK }}/durable
          retention-days: 14

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supply-chain-evidence-${{ matrix.token }}-attempt-${{ github.run_attempt }}
          path: |
            declared.sbom.cdx.json
            installed.sbom.cdx.json
            cves.json
            grype.txt
            digest.txt
            cosign-verify.txt
            ${{ matrix.exceptions }}
            sbom-reference.json
            ctx/plan.json
            ctx/generated-manifest.json
            ${{ env.WORK }}/evidence
            ${{ env.WORK }}/gate.grype.yaml
            ${{ env.WORK }}/effective-exceptions.json
            ${{ env.WORK }}/image.txt
            ${{ env.WORK }}/bootcheck
            ${{ env.WORK }}/session
            ${{ env.WORK }}/firstboot
            ${{ env.WORK }}/journal-failed-boot
            !${{ env.WORK }}/**/*.qcow2
            latest-digest.txt
            provenance.json
          retention-days: 14
          if-no-files-found: warn

  evidence:
    needs: publish
    if: (github.event_name == 'schedule' || inputs.publish) && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    environment: evidence-write
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - token: centos-stream-10
            workstation: deskos-core-centos-stream-10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: supply-chain-durable-${{ matrix.token }}-attempt-${{ github.run_attempt }}
          path: durable
      - name: Publish durable evidence
        env:
          EVIDENCE_S3_ENDPOINT: ${{ vars.EVIDENCE_S3_ENDPOINT }}
          EVIDENCE_S3_REGION: ${{ vars.EVIDENCE_S3_REGION }}
          EVIDENCE_S3_BUCKET: ${{ vars.EVIDENCE_S3_BUCKET }}
          EVIDENCE_PUBLIC_BASE_URL: ${{ vars.EVIDENCE_PUBLIC_BASE_URL }}
          EVIDENCE_S3_ACCESS_KEY_ID: ${{ secrets.EVIDENCE_S3_ACCESS_KEY_ID }}
          EVIDENCE_S3_SECRET_ACCESS_KEY: ${{ secrets.EVIDENCE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          digest="$(tr -d '\r\n' < durable/digest.txt)"
          test -n "$digest"
          python3 tests/evidence/upload.py --dir durable --digest "$digest" \
            --namespace deskos --repository "deskos-core-${{ matrix.token }}" --public
          base="${EVIDENCE_PUBLIC_BASE_URL%/}/deskos/deskos-core-${{ matrix.token }}/sha256/${digest#sha256:}"
          tmp="$(mktemp -d)"
          curl -fsS "$base/index.json" -o "$tmp/index.json"
          jq -r '.objects[] | .name' "$tmp/index.json" | while read -r name; do
            mkdir -p "$tmp/$(dirname "$name")"
            curl -fsS "$base/$name" -o "$tmp/$name"
          done
          python3 tests/evidence/verify.py --index "$tmp/index.json" --dir "$tmp" --digest "$digest"

  # The installer is a derived artifact, so it is its own workflow: a failure
  # there costs one ISO build and a dispatch, not a two-hour rebuild of an image
  # that already passed this gate, and the image's evidence is unaffected.
  #
  # One entry per platform that publishes an installer. A second platform gets a
  # second call here; the digest always comes from the job above, so a wrong
  # repository fails at the pull instead of shipping the wrong ISO.
  iso:
    needs: publish
    # Each leg resolves its own image: a platform whose publish leg failed has no
    # image, so its installer skips, and the platforms that did publish still get
    # theirs. Without `always()` one failed leg cancels both installers.
    if: always() && (github.event_name == 'schedule' || inputs.publish) && github.ref == 'refs/heads/main'
    strategy:
      # One installer per published image, and one failing installer must not
      # hide the other.
      fail-fast: false
      matrix:
        include:
          - image: quay.io/deskos/deskos-core-centos-stream-10
            rootfs: xfs
          - image: quay.io/deskos/deskos-core-fedora-45
            rootfs: btrfs
    uses: ./.github/workflows/iso.yml
    with:
      image: ${{ matrix.image }}
      # Empty on purpose: the publish job above is a matrix, so a single
      # `needs.publish.outputs.digest` is whichever leg finished last, not the
      # digest of this image. The installer resolves $IMAGE:$COMMIT and verifies
      # the gate's signature over the digest it resolved.
      digest: ""
      commit: ${{ github.sha }}
      rootfs: ${{ matrix.rootfs }}
    secrets: inherit
