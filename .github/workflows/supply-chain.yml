name: supply-chain (experimental)

# Manual only. Builds DeskOS Core for CentOS Stream 10 from this checkout,
# writes the declared SBOM with `deskosctl sbom`, produces the installed
# SBOM with Syft, scans it with Grype, compares the two for RPM coverage,
# and uploads the evidence. RHEL scanning runs on the entitled factory
# host, not here. See docs/supply-chain.md and ADR 0010.
on:
  workflow_dispatch:
    inputs:
      fail-on:
        description: Grype severity that fails the job
        type: choice
        options: [negligible, low, medium, high, critical]
        default: critical
      publish:
        description: Push the scanned image to quay.io and sign it (main only)
        type: boolean
        default: false

permissions:
  contents: read
  # Keyless cosign: Fulcio issues a short-lived certificate from the
  # workflow's OIDC identity and Rekor records the signature.
  id-token: write

concurrency:
  group: supply-chain
  cancel-in-progress: false

env:
  IMAGE: localhost/deskos-core-centos10:ci
  # bootc-image-builder pinned to the digest used for local test disks (same
  # as vm-bootcheck.yml).
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b

jobs:
  centos10:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Render the Core build context and write the declared SBOM
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render ./resources --workstation deskos-core-centos10 --output ctx
          ./bin/deskosctl sbom ./resources --workstation deskos-core-centos10 --output declared.sbom.cdx.json

      - name: Put container storage on /mnt
        # The root disk is small; the same layout as vm-bootcheck.yml.
        run: |
          sudo mkdir -p /mnt/containers /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf

      - name: Build the image
        timeout-minutes: 40
        run: sudo podman build --pull=missing -t "$IMAGE" ctx

      - name: Export the image to an OCI archive
        run: |
          sudo podman save --format oci-archive -o image.tar "$IMAGE"
          sudo chown "$(id -u):$(id -g)" image.tar
          ls -lh image.tar

      - name: Install Syft and Grype (pinned)
        env:
          SYFT_VERSION: v1.54.0
          GRYPE_VERSION: v0.120.0
        run: |
          # Pinned releases, installed from the tag: the scanner code must not
          # change between runs of the same commit, even when the scan gates a
          # real release. The installers verify the release checksums.
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/$SYFT_VERSION/install.sh" | sh -s -- -b "$HOME/.local/bin" "$SYFT_VERSION"
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/$GRYPE_VERSION/install.sh" | sh -s -- -b "$HOME/.local/bin" "$GRYPE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Installed SBOM (Syft)
        run: syft oci-archive:image.tar -o cyclonedx-json=installed.sbom.cdx.json

      - name: CVE scan (Grype)
        run: |
          grype oci-archive:image.tar -o table | tee grype.txt
          grype oci-archive:image.tar -o json > cves.json
          # The gate applies the severity policy: .grype.yaml from this
          # directory and the OpenVEX statements (ADR 0012). The evidence
          # above stays unfiltered.
          grype oci-archive:image.tar \
            --vex tests/supply-chain/vex.openvex.json \
            --fail-on "${{ inputs.fail-on }}" -o table > /dev/null

      - name: Compare declared and installed SBOMs
        run: python3 tests/supply-chain/compare.py declared.sbom.cdx.json installed.sbom.cdx.json

      - name: Build a QCOW2 without the builder's kernel arguments
        timeout-minutes: 30
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=missing \
            --security-opt label=type:unconfined_t \
            -v ./output:/output -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type qcow2 --no-default-kernel-args \
            --chown "$(id -u):$(id -g)" "$IMAGE"
          qemu-img check output/qcow2/disk.qcow2

      - name: Boot check (unmodified disk)
        timeout-minutes: 15
        run: |
          python3 tests/vm/bootcheck.py --disk output/qcow2/disk.qcow2 \
            --out bootcheck --expect-splash --hash-disk --boot-timeout 420

      - name: Session check (instrumented boot)
        timeout-minutes: 25
        run: |
          python3 tests/vm/sessioncheck.py --mode session --disk output/qcow2/disk.qcow2 \
            --plan ctx/plan.json --out session --boot-timeout 900
          # Record the image that passed; the same image is tagged, pushed and
          # signed below, so the published digest is the tested one.
          sudo podman image inspect "$IMAGE" --format 'id={{.Id}}' | tee image.txt

      - name: Install cosign
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish, sign and attest the scanned image
        # CentOS Stream 10 only; RHEL images are never published. The
        # signature is keyless: it is bound to this workflow's OIDC
        # identity, and the installed SBOM is attached as an attestation.
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          DEST: quay.io/deskos/deskos-core
          QUAY_ROBOT_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_ROBOT_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: |
          printf '%s' "$QUAY_ROBOT_TOKEN" | sudo podman login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          sudo podman tag "$IMAGE" "$DEST:$GITHUB_SHA" "$DEST:latest"
          sudo podman push --digestfile digest.txt "$DEST:$GITHUB_SHA"
          sudo podman push "$DEST:latest"
          digest="$(tr -d '\n\r' < digest.txt)"
          ref="$DEST@$digest"
          printf '%s' "$QUAY_ROBOT_TOKEN" | cosign login quay.io --username "$QUAY_ROBOT_USERNAME" --password-stdin
          cosign sign --yes "$ref"
          cosign attest --yes --type cyclonedx --predicate installed.sbom.cdx.json "$ref"
          cosign verify "$ref" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/deskosproject/deskos-core/' | tee cosign-verify.txt
          cosign logout quay.io
          sudo podman logout quay.io
          echo "Published, signed and attested $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-evidence
          path: |
            declared.sbom.cdx.json
            installed.sbom.cdx.json
            cves.json
            grype.txt
            digest.txt
            cosign-verify.txt
            ctx/plan.json
            ctx/generated-manifest.json
          retention-days: 14
          if-no-files-found: warn
