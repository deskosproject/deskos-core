name: identity-ad

# Once a day, and on demand: build the identity client image, boot it, join it to
# a disposable Samba AD DC on the runner through the realm's own DNS, and log in
# as the directory user. It is not a pull-request gate: it builds a container and
# a VM and it is slow.
#
# This proves the AD client path (`realm`/`adcli`/`sssd-ad`), not FreeIPA's. The
# DC is a test fixture built from `tests/identity/samba`, never a support claim,
# and it says nothing about Windows-specific behaviour such as Group Policy.
on:
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      no_join:
        description: Boot and check the session without joining, to isolate a boot hang from the join
        type: boolean
        default: false
  # It is not a per-pull-request check. These paths exercise it before a change
  # merges, and they name code and fixtures only: editing a README under
  # tests/identity/ used to start a 20-minute run.
  pull_request:
    paths:
      - .github/workflows/identity-ad.yml
      - tests/identity/*.sh
      - tests/identity/*.py
      - tests/identity/resources/**
      - tests/identity/samba/**
      - tests/vm/sessioncheck.py
      - tests/vm/test_sessioncheck.py

permissions:
  contents: read

concurrency:
  # Per ref, so a pull request cannot cancel the nightly run or another pull
  # request: one global group meant the newest push cancelled everyone else's
  # check and left it red without running.
  group: identity-ad-${{ github.ref }}
  cancel-in-progress: true

env:
  # A machine joins one realm. This workspace, tag and disk are AD-only: a disk
  # joined to FreeIPA cannot be re-joined to AD, because the realm, sssd, keytab
  # and authselect state from the first join are still there.
  WORK: /mnt/deskos-ad-work
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b
  AD_IMAGE: localhost/deskos-ad:ci
  AD_SERVER_HOSTNAME: dc.ad.lab.test
  WS: identity-client-centos-stream-10
  IMAGE: localhost/identity-client-ad-centos-stream-10:ci

jobs:
  identity-ad:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install podman, QEMU, OVMF and openssl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman openssl qemu-system-x86 qemu-utils ovmf

      - name: Put container storage and outputs on /mnt
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/containers "$WORK" /var/lib/containers /etc/containers
          sudo mount --bind /mnt/containers /var/lib/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          sudo chown "$(id -u):$(id -g)" "$WORK"
          sudo rm -f /etc/cni/net.d/87-podman-bridge.conflist

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build the disposable AD DC image
        timeout-minutes: 20
        run: sudo podman build -t "$AD_IMAGE" tests/identity/samba

      - name: Start the disposable AD DC
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 24 | tr -d '\n/+=' | head -c 20)"
          echo "::add-mask::$password"
          echo "ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          export ADMIN_PASSWORD="$password"
          sudo -E tests/identity/samba-ad.sh start

      - name: Wait for the AD DC
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Provisioning builds the directory from the schema and takes under a
          # minute; a dead container is reported at once instead of waiting out
          # the loop.
          for i in $(seq 1 60); do
            if sudo tests/identity/samba-ad.sh status; then
              echo "the DC answers after $((i * 5))s"
              exit 0
            fi
            state=$(sudo podman inspect --format '{{.State.Status}}' deskos-ad 2>/dev/null || echo missing)
            if [ "$state" != running ]; then
              echo "container deskos-ad is $state, not running" >&2
              sudo podman inspect deskos-ad \
                --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' >&2 || true
              sudo podman logs deskos-ad 2>&1 | tail -80 || true
              exit 1
            fi
            sleep 5
          done
          echo "the DC did not answer within five minutes" >&2
          sudo podman logs deskos-ad 2>&1 | tail -80 || true
          exit 1

      - name: Render the identity image
        run: |
          go build -o bin/deskosctl ./cmd/deskosctl
          ./bin/deskosctl render tests/identity/resources --workstation "$WS" --output ctx
          sha256sum ctx/plan.json ctx/generated-manifest.json

      - name: Pull the base and the builder
        run: |
          set -euo pipefail
          base=$(grep -m1 '^FROM ' ctx/Containerfile | awk '{print $2}')
          for ref in "$base" "$BIB"; do
            ok=0
            for i in 1 2 3 4 5; do
              if sudo podman pull "$ref"; then ok=1; break; fi
              echo "attempt $i failed pulling $ref; retrying in 20s" >&2
              sleep 20
            done
            [ "$ok" = 1 ] || { echo "could not pull $ref" >&2; exit 1; }
          done

      - name: Build the identity image
        timeout-minutes: 40
        run: sudo podman build --pull=never -t "$IMAGE" ctx

      - name: Build a QCOW2
        timeout-minutes: 30
        run: |
          mkdir -p "$WORK/output"
          sudo podman run --rm --privileged --pull=never \
            --security-opt label=type:unconfined_t \
            -v "$WORK/output:/output" \
            -v "$PWD/tests/vm/config.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "$BIB" build --type qcow2 --config /config.toml --no-default-kernel-args \
            --chown "$(id -u):$(id -g)" "$IMAGE"
          qemu-img check "$WORK/output/qcow2/disk.qcow2"

      - name: Create the directory user
        run: |
          set -euo pipefail
          export AD_USER=qa
          user_password="$(openssl rand -base64 24 | tr -d '\n/+=' | head -c 20)"
          echo "::add-mask::$user_password"
          echo "AD_USER_PASSWORD=$user_password" >> "$GITHUB_ENV"
          export AD_USER_PASSWORD="$user_password"
          sudo -E tests/identity/samba-ad.sh user
          sudo podman exec deskos-ad samba-tool user show qa

      - name: Join the identity VM, log in at GDM and check the session
        timeout-minutes: 30
        run: |
          # The control: with no_join the DC still runs, but the machine is not
          # joined. If the desktop appears, a boot that never reaches the greeter
          # is the join path; if it still hangs at the splash, the DC's presence
          # or the runner is what breaks the boot.
          if [ "${{ inputs.no_join }}" = "true" ]; then
            python3 tests/vm/sessioncheck.py --mode session \
              --disk "$WORK/output/qcow2/disk.qcow2" --plan ctx/plan.json \
              --out "$WORK/session" --boot-timeout 900
            exit 0
          fi
          python3 tests/vm/sessioncheck.py --mode session \
            --disk "$WORK/output/qcow2/disk.qcow2" --plan ctx/plan.json \
            --out "$WORK/session" --boot-timeout 900 \
            --join-kind ad --join-domain ad.lab.test --join-realm AD.LAB.TEST \
            --join-server "$AD_SERVER_HOSTNAME" --join-dns 10.0.2.2 \
            --join-principal Administrator --join-password "$ADMIN_PASSWORD" \
            --join-user qa@ad.lab.test --join-gdm

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p evidence
          cp -a "$WORK/session" evidence/ 2>/dev/null || true
          cp ctx/plan.json ctx/generated-manifest.json evidence/ 2>/dev/null || true
          sudo podman inspect deskos-ad \
            --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' \
            > evidence/container-state.txt 2>&1 || true
          sudo podman logs deskos-ad > evidence/ad-dc.log 2>&1 || true
          sudo podman exec deskos-ad samba --version > evidence/samba-version.txt 2>&1 || true
          sudo podman exec deskos-ad samba-tool domain level show > evidence/domain-level.txt 2>&1 || true
          sudo podman exec deskos-ad samba-tool user show qa > evidence/user.txt 2>&1 || true
          sudo -E tests/identity/samba-ad.sh status > evidence/srv.txt 2>&1 || true
          sudo chown -R "$(id -u):$(id -g)" evidence 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: identity-ad-evidence
          path: evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Stop the disposable DC
        if: always()
        run: sudo tests/identity/samba-ad.sh purge || true
