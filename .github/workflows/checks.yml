name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Reused by the release workflow before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    # Cheap checks only: no image builds, registry logins or QEMU.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The pin check compares against the pull request's base, so it needs
          # the base branch in the clone.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt
        # The assignment fails the step if gofmt cannot run.
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "$out"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: VM boot check harness unit tests
        run: python3 -m unittest discover -s tests/vm
      - name: QA gallery unit tests
        # The gallery reads the VM artifacts; it does not build or boot an image.
        run: python3 -m unittest discover -s tests/qa
      - name: lifecycle harness unit tests
        run: python3 -m unittest discover -s tests/lifecycle
      - name: evidence and promotion unit tests
        run: python3 -m unittest discover -s tests/evidence
      - name: supply-chain harness unit tests
        run: python3 -m unittest discover -s tests/supply-chain
      - name: artifact check unit tests
        run: python3 -m unittest discover -s tests/artifacts
      - name: workflow YAML GitHub would accept
        run: python3 -m unittest discover -s tests/workflows
      - name: build deskosctl
        run: go build -o bin/deskosctl ./cmd/deskosctl
      - name: validate resources and examples
        run: |
          # Examples are validated, not planned or rendered: a change to one
          # cannot slow the pipeline, and the compiler fixtures are reference
          # workstations rather than example roots.
          for ex in layers developer office kiosk identity offline centos-stream-10 rhel-10 vanilla-gnome; do
            ./bin/deskosctl validate "./examples/$ex"
          done
      - name: validate the Core tree
        run: ./bin/deskosctl validate --no-core ./resources
      - name: plan the reference workstations
        run: |
          ./bin/deskosctl plan --workstation deskos-core-centos-stream-10
          ./bin/deskosctl plan --workstation deskos-core-almalinux-10
          ./bin/deskosctl plan --workstation deskos-core-fedora-45
          ./bin/deskosctl plan --no-core ./resources ./tests/identity/resources --workstation identity-client-centos-stream-10
      - name: Which platform pins changed
        id: pins
        run: |
          # A docs-only pull request does not build anything, so a vendor digest
          # that moved under it is not this pull request's failure: main and the
          # weekly gate still check the pins, and a pull request that changes a
          # platform checks its own.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
             | grep -qE '^resources/platforms/|^\.github/workflows/checks\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No platform pin changed; the registry check runs on main." 
          fi
      - name: the pinned bases exist in their registries
        if: steps.pins.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          # A base pinned by digest is a promise that its registry still serves
          # that digest, and publishing the base breaks it. On 2026-10-17 the
          # Ubuntu base was republished with a different digest, the platform kept
          # the old one, and every Ubuntu build answered `manifest unknown` for
          # over an hour — including a merge, because the VM legs do not gate it.
          # Nothing caught it earlier because the platform and its goldens pinned
          # the same stale digest: they agreed with each other while the registry
          # disagreed.
          #
          # Deliberately not a Go test and not part of `make check`: the compiler
          # and its tests must work with no network (AGENTS.md, invariant 11).
          # This is a CI step, and it only reads.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends skopeo >/dev/null
          python3 - <<'PY' > /tmp/pins.txt
          import glob, yaml
          for f in sorted(glob.glob('resources/platforms/*.yaml')):
              d = yaml.safe_load(open(f)) or {}
              b = (d.get('spec') or {}).get('bootc') or {}
              if b.get('image') and b.get('digest'):
                  print(f.split('/')[-1], b['image'], b['digest'])
          PY
          while read -r platform image digest; do
            # The platform names a tag and a digest, and skopeo refuses both at
            # once, so the digest is asked for by repository: the tag is what a
            # human reads in the resource, the digest is what gets pulled.
            repo="${image%:*}"
            err="$(sudo skopeo inspect "docker://$repo@$digest" 2>&1 >/dev/null || true)"
            case "$err" in
              "")
                echo "ok        $platform  $image@${digest:0:19}…" ;;
              *"manifest unknown"*|*"not found"*)
                echo "::error::$platform pins $image@$digest, which its registry does not serve any more. Re-pin it to the digest the registry serves."
                exit 1 ;;
              *"unauthorized"*|*"authentication required"*|*"denied"*|*"credentials"*)
                # An entitled registry (RHEL) cannot be checked anonymously, and
                # `unauthorized` does not distinguish private from absent: report
                # it and claim neither.
                echo "unchecked $platform  $image@${digest:0:19}… (registry needs credentials)" ;;
              *)
                echo "::error::$platform could not be checked: $err"
                exit 1 ;;
            esac
          done < /tmp/pins.txt
      - name: render twice and compare
        run: |
          # The embedded Core, twice, for every shipped workstation.
          for ws in deskos-core-centos-stream-10 deskos-core-almalinux-10 deskos-core-fedora-45; do
            ./bin/deskosctl render --workstation "$ws" --output "dist/a/$ws"
            ./bin/deskosctl render --workstation "$ws" --output "dist/b/$ws"
          done
          # An organization overlay passed in both orders, with --no-core.
          ./bin/deskosctl render --no-core ./resources ./tests/identity/resources \
            --workstation identity-client-centos-stream-10 --output dist/c/identity
          ./bin/deskosctl render --no-core ./tests/identity/resources ./resources \
            --workstation identity-client-centos-stream-10 --output dist/d/identity
          diff -r dist/a dist/b
          diff -r dist/c dist/d
